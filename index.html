    .table tbody td { padding:11px 12px; border-color:#e2e8f0; vertical-align:middle; }

    .attendance-btn:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,23,42,.08); }
    .attendance-btn.present.active { background:#10b981; border-color:#10b981; color:#fff; }
    .attendance-btn.late.active { background:#f59e0b; border-color:#f59e0b; color:#fff; }
    .attendance-btn.excused.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
    .attendance-btn.unexcused.active { background:#ef4444; border-color:#ef4444; color:#fff; }
    .attendance-summary { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .att-box { border-radius:15px; padding:12px; text-align:center; border:1px solid #e2e8f0; }
    .att-box strong { font-size:1.45rem; display:block; }
    .att-box.unmarked{background:#f8fafc;color:#475569}.att-box.present{background:#ecfdf5;color:#047857}.att-box.late{background:#fffbeb;color:#b45309}.att-box.excused{background:#eff6ff;color:#1d4ed8}.att-box.unexcused{background:#fff1f2;color:#be123c}
    .mini-avatar { width:42px; height:42px; border-radius:12px; overflow:hidden; display:grid; place-items:center; background:var(--teal-gradient); color:#fff; font-weight:900; flex:0 0 42px; box-shadow:0 4px 10px rgba(13,148,136,.12); }
    .mini-avatar img { width:100%; height:100%; object-fit:cover; }
    .attendance-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; margin-top:14px; }
    .attendance-card { padding:14px; border:2px solid #d9fdf7; border-radius:20px; background:linear-gradient(135deg,#ffffff 0%,#f8fffe 100%); box-shadow:0 8px 24px rgba(13,148,136,.08); }
    .attendance-card-head { display:flex; gap:12px; align-items:center; }
    .attendance-stt { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#e6fffa; color:#0f766e; font-weight:900; flex:0 0 30px; }
    .attendance-info { min-width:0; flex:1; }
    .attendance-name { font-weight:900; font-size:1.04rem; line-height:1.25; }
    .attendance-meta { font-size:.78rem; color:#64748b; margin-top:4px; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; font-size:.78rem; font-weight:800; margin-top:8px; }
    .status-pill.unmarked { background:#f1f5f9; color:#475569; }
    .status-pill.present { background:#ecfdf5; color:#047857; }
    .status-pill.late { background:#fffbeb; color:#b45309; }
    .status-pill.excused { background:#eff6ff; color:#1d4ed8; }
    .status-pill.unexcused { background:#fff1f2; color:#be123c; }
    .attendance-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .attendance-note { margin-top:10px; padding-top:10px; border-top:1px dashed #dbe7e9; font-size:.76rem; color:#64748b; }
    .board-wrap { background:#f8fafc; border-radius:18px; border:2px solid #cbd5e1; padding:16px; overflow:auto; }
    .class-board { min-width:680px; padding:16px; perspective:900px; }
    .class-board.mode-3d .seat-grid { transform:rotateX(16deg); transform-origin:top center; margin-top:8px; }
    .class-board.mode-3d .seat { box-shadow:0 12px 18px rgba(15,23,42,.13); transform:translateZ(8px); }
    .chalkboard { background:linear-gradient(135deg,#123a47,#0f4c5c); border:8px solid #9a6b3a; border-radius:12px; color:#fde68a; padding:17px; text-align:center; font-weight:900; letter-spacing:.08em; box-shadow:0 12px 24px rgba(15,23,42,.2); }
    .teacher-desk { width:230px; margin:18px auto 22px; padding:12px; text-align:center; border-radius:13px; background:#ede9fe; border:2px solid #c4b5fd; color:#6d28d9; font-weight:900; }
    .seat-grid { display:grid; gap:14px; align-items:start; }
    .seat-lane { background:#f1f5f9; border-radius:14px; padding:10px; display:grid; gap:10px; }
    .lane-label { text-align:center; background:var(--teal-gradient); color:white; font-weight:900; border-radius:999px; padding:5px 10px; }
    .seat { min-height:96px; border-radius:13px; border:2px dashed #cbd5e1; background:white; padding:8px; display:flex; align-items:center; gap:8px; position:relative; }
    .seat.filled { border-style:solid; border-color:#99f6e4; box-shadow:0 6px 14px rgba(13,148,136,.1); }
    .seat .mini-avatar { width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal-gradient);color:white;font-weight:900;overflow:hidden;flex:0 0 38px; }
    .seat .mini-avatar img{width:100%;height:100%;object-fit:cover}
    .seat small { color:#64748b; }
    .timetable { overflow:auto; }
    .timetable-grid { display:grid; grid-template-columns:105px repeat(5,minmax(160px,1fr)); gap:1px; background:#cbd5e1; border:1px solid #cbd5e1; min-width:930px; border-radius:14px; overflow:hidden; }
    .tt-cell { background:white; min-height:72px; padding:8px; }
    .tt-head { background:var(--teal-gradient); color:white; font-weight:900; display:flex;align-items:center;justify-content:center;min-height:50px; }
    .tt-time { background:#f0fdfa; font-weight:800; color:#0f766e; display:flex;flex-direction:column;justify-content:center;text-align:center; }
    .lesson { border-radius:10px; padding:7px; background:#ecfeff; border-left:4px solid #0d9488; font-size:.82rem; cursor:pointer; }
    .reward-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .reward-card { overflow:hidden; }
    .reward-visual { height:125px; display:grid; place-items:center; font-size:3.5rem; background:linear-gradient(135deg,#ecfdf5,#cffafe); }
    .reward-body { padding:14px; }
    .wheel-layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; }
    .wheel-card { padding:18px; position:relative; overflow:hidden; }
    .wheel-machine { width:min(520px,90vw); aspect-ratio:1/1; border-radius:50%; border:8px solid #14b8a6; margin:10px auto; position:relative; background:radial-gradient(circle,#f0fdfa 0,#ecfeff 55%,#ccfbf1 100%); box-shadow:inset 0 0 35px rgba(13,148,136,.15),0 20px 35px rgba(13,148,136,.2); overflow:hidden; }
    .wheel-machine::before { content:"✦"; position:absolute; inset:0; display:grid; place-items:center; font-size:5rem; color:#0d9488; opacity:.22; }
    .wheel-ball { position:absolute; width:58px; height:58px; border-radius:50%; border:3px solid white; box-shadow:0 4px 12px rgba(15,23,42,.25); display:grid; place-items:center; background:var(--teal-gradient); color:white; font-weight:900; overflow:hidden; transform:translate(-50%,-50%); transition:all 1.1s cubic-bezier(.2,.8,.2,1); }
    .wheel-ball img{width:100%;height:100%;object-fit:cover}
    .wheel-machine.spinning .wheel-ball { animation:orbit .72s linear infinite; }
    .wheel-machine.fx1.spinning .wheel-ball { animation:bounceBall .48s ease-in-out infinite alternate; }
    .wheel-machine.fx2.spinning .wheel-ball { animation:suckCenter .82s ease-in-out infinite; }
    .wheel-machine.fx3.spinning .wheel-ball { animation:flyOrbit .95s ease-in-out infinite alternate; }
    .wheel-machine.fx4.spinning .wheel-ball { animation:rainBall .85s ease-in infinite; }
    .wheel-machine.fx5.spinning { animation:stageGlow .5s ease-in-out infinite alternate; }
    .wheel-machine.fx5.spinning .wheel-ball { animation:spotlight .6s ease-in-out infinite alternate; }
    .wheel-machine.fx6.spinning .wheel-ball { animation:waveBall .7s ease-in-out infinite alternate; }
    @keyframes orbit { 0%{filter:hue-rotate(0)}50%{transform:translate(-50%,-50%) scale(1.12) rotate(180deg)}100%{filter:hue-rotate(360deg);transform:translate(-50%,-50%) rotate(360deg)} }
    @keyframes bounceBall { from{transform:translate(-50%,-50%) scale(.82)} to{transform:translate(-50%,-68%) scale(1.18)} }
    @keyframes suckCenter { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.72)} }
    @keyframes flyOrbit { from{transform:translate(-70%,-35%) rotate(-18deg)} to{transform:translate(-30%,-65%) rotate(18deg)} }
    @keyframes rainBall { 0%{transform:translate(-50%,-160%) scale(.85)} 65%{transform:translate(-50%,10%) scale(1.08)} 100%{transform:translate(-50%,-50%) scale(1)} }
    @keyframes stageGlow { from{box-shadow:inset 0 0 35px rgba(13,148,136,.15),0 20px 35px rgba(13,148,136,.2)} to{box-shadow:inset 0 0 70px rgba(251,191,36,.42),0 0 45px rgba(139,92,246,.4)} }
    @keyframes spotlight { from{filter:brightness(.75);transform:translate(-50%,-50%) scale(.9)} to{filter:brightness(1.35);transform:translate(-50%,-50%) scale(1.15)} }
    @keyframes waveBall { from{transform:translate(-50%,-62%) rotate(-8deg)} to{transform:translate(-50%,-38%) rotate(8deg)} }
    .effect-chip { border:1px solid #cbd5e1; border-radius:999px; padding:7px 10px; background:#fff; font-size:.8rem; font-weight:800; cursor:pointer; }

    .film-strip { display:flex; align-items:center; height:100%; gap:16px; padding:18px; transition:transform 2.7s cubic-bezier(.1,.7,.1,1); will-change:transform; }
    .film-person { flex:0 0 126px; height:154px; border-radius:16px; background:#123a5a; border:2px solid rgba(255,255,255,.18); color:white; display:flex; flex-direction:column;align-items:center;justify-content:center;gap:8px; text-align:center; }

    .film-person .mini-avatar img{width:100%;height:100%;object-fit:cover}

function getClassSession(classId = (state?.activeClassId || '')){

  if (c && (c.session === 'morning' || c.session === 'afternoon')) {
    return c.session;
  }
  const gradeStr = String(c?.grade || c?.name || '');

function defaultSeating(students, clsId, groupAssignments = null){
  const ss = (students || []).filter(s => s.classId === clsId);
  const groups = ['Tổ 1', 'Tổ 2', 'Tổ 3', 'Tổ 4'];
  const ga = groupAssignments || (typeof window !== 'undefined' ? window.state?.competition?.groupAssignments : null);
  const hasGa = ga && Object.keys(ga).length > 0;
  const buckets = groups.map((g, gi) => {
    if (hasGa) {
      const matched = ss.filter(s => ga[s.id] === g);
      if (matched.length > 0) return matched;
    }
    return ss.filter((s, si) => (si % 4 === gi));
  });
  const assigned = new Set(buckets.flat().map(s => s.id));
  const ungrouped = ss.filter(s => !assigned.has(s.id));
  if (ungrouped.length) {
    ungrouped.forEach((s, idx) => buckets[idx % 4].push(s));
  }
  const maxSize = Math.max(1, ...buckets.map(b => b.length));
  const desksPerLane = Math.max(6, Math.ceil(maxSize / 2));
  const totalDesks = 4 * desksPerLane;
  const assignments = {};
  buckets.forEach((members, lane) => {
    const desks = seatIndicesForLane(totalDesks, 4, lane);
    let p = 0;
    desks.forEach(idx => {
      if (p >= members.length) return;
      assignments[String(idx)] = {
        left: members[p++]?.id || '',
        right: members[p++]?.id || ''
      };
    });
  });
  return { lanes: 4, seats: Math.max(totalDesks, 24), mode: '2d', assignments };
}

function syncClassesAndAccounts(forceUpdateNames = true) {
  if (!state || !Array.isArray(state.classes)) return false;
  state.accounts = state.accounts || [];
  let didChange = false;
  const currentClassIds = new Set(state.classes.map(c => c.id));

  // 1. Quét từng lớp trong state.classes để tạo/cập nhật GVCN và 4 Tổ Trưởng
  state.classes.forEach(c => {
    const cleanSuffix = c.id.replace(/^class_/, '').toLowerCase();
    const teacherUser = `gv_${cleanSuffix}`;
    const cleanTeacherName = String(c.teacherName || '').trim();
    const hasTeacher = cleanTeacherName && cleanTeacherName !== 'Chưa phân công' && cleanTeacherName !== 'Chưa có GVCN';
    const teacherDisplay = hasTeacher ? `${cleanTeacherName} (GVCN ${c.name})` : `GVCN ${c.name}`;

    // 1.1 Cập nhật hoặc thêm mới tài khoản GVCN
    let tAcc = state.accounts.find(a => a.username.toLowerCase() === teacherUser);
    if (!tAcc) {
      tAcc = state.accounts.find(a => a.role === 'teacher' && a.assignedClass === c.id);
    }

    if (tAcc) {
      if (tAcc.assignedClass !== c.id) {
        tAcc.assignedClass = c.id;
        didChange = true;
      }
      if (forceUpdateNames && hasTeacher && tAcc.fullname !== teacherDisplay) {
        tAcc.fullname = teacherDisplay;
        didChange = true;
      }
    } else {
      state.accounts.push({
        id: uid('acc'),
        username: teacherUser,
        password: '123456',
        fullname: teacherDisplay,
        role: 'teacher',
        assignedClass: c.id,
        assignedGroup: '*',
        status: 'active',
        phone: '',
        updatedAt: new Date().toISOString()
      });
      didChange = true;
    }

    // 1.2 Đảm bảo đủ 4 tài khoản Tổ Trưởng cho lớp này
    ['Tổ 1', 'Tổ 2', 'Tổ 3', 'Tổ 4'].forEach((grp, idx) => {
      const tNum = idx + 1;
      const ttUser = `totruong_${cleanSuffix}_t${tNum}`;
      let ttAcc = state.accounts.find(a => a.role === 'group_leader' && a.assignedClass === c.id && a.assignedGroup === grp);
      if (!ttAcc) {
        ttAcc = state.accounts.find(a => a.username.toLowerCase() === ttUser);
      }
      if (ttAcc) {
        if (ttAcc.assignedClass !== c.id || ttAcc.assignedGroup !== grp) {
          ttAcc.assignedClass = c.id;
          ttAcc.assignedGroup = grp;
          didChange = true;
        }
      } else {
        state.accounts.push({
          id: uid('acc'),
          username: ttUser,
          password: '1234',
          fullname: `Tổ Trưởng ${grp} (${c.name})`,
          role: 'group_leader',
          assignedClass: c.id,
          assignedGroup: grp,
          status: 'active',
          phone: '',
          updatedAt: new Date().toISOString()
        });
        didChange = true;
      }
    });
  });

  // 2. Dọn dẹp tài khoản mồ côi (khi lớp học đã bị xóa)
  const prevAccCount = state.accounts.length;
  state.accounts = state.accounts.filter(a => {
    if (a.role === 'group_leader' && a.assignedClass !== '*' && !currentClassIds.has(a.assignedClass)) {
      return false; // Thu hồi tài khoản tổ trưởng của lớp đã bị xóa
    }
    return true;
  });
  if (state.accounts.length !== prevAccCount) didChange = true;

  // Giáo viên chủ nhiệm của lớp bị xóa: chuyển sang trạng thái "Chưa phân công lớp" (*)
  state.accounts.forEach(a => {
    if (a.role === 'teacher' && a.assignedClass !== '*' && !currentClassIds.has(a.assignedClass)) {
      a.assignedClass = '*';
      a.fullname = a.fullname.replace(/\(GVCN [^)]+\)/, '').trim();
      didChange = true;
    }
  });

  // 3. Khử trùng lặp tài khoản (Deduplication)
  const accMap = new Map();
  state.accounts.forEach(a => {
    const u = a.username.toLowerCase();
    if (!accMap.has(u)) {
      accMap.set(u, a);
    } else {
      const existing = accMap.get(u);
      accMap.set(u, Object.assign({}, existing, a));
      didChange = true;
    }
  });
  state.accounts = Array.from(accMap.values());

  // 4. Đồng bộ vào DEFAULT_ACCOUNTS
  state.accounts.forEach(a => {
    const dIdx = DEFAULT_ACCOUNTS.findIndex(def => def.username.toLowerCase() === a.username.toLowerCase());
    if (dIdx >= 0) {
      Object.assign(DEFAULT_ACCOUNTS[dIdx], {
        fullname: a.fullname,
        password: a.password,
        pin: a.password || a.pin,
        assignedClass: a.assignedClass,
        assignedGroup: a.assignedGroup
      });
    } else {
      DEFAULT_ACCOUNTS.push({
        username: a.username,
        password: a.password,
        pin: a.password || a.pin,
        fullname: a.fullname,
        role: a.role,
        assignedClass: a.assignedClass,
        assignedGroup: a.assignedGroup
      });
    }
  });

  if (didChange) {
    saveState(false);
  }
  return didChange;
}

function autoLoginTeacher(username, password){
  const accountsList = (state && Array.isArray(state.accounts) && state.accounts.length) ? state.accounts : DEFAULT_ACCOUNTS;
  let localAcc = findMatchingAccount(accountsList, username);
  if (!localAcc) {
    const cleanU = username.toLowerCase().replace(/^gv[_]?/, '').replace(/^class[_]?/, '');
    let foundCls = state.classes.find(c => c.name.toLowerCase() === cleanU || c.id.toLowerCase() === `class_${cleanU}`);
    if (!foundCls) {
      foundCls = { id: 'class_' + cleanU, name: cleanU.toUpperCase(), grade: `Khối ${cleanU[0] || '8'}`, year: '2026 - 2027', teacherName: `GVCN ${cleanU.toUpperCase()}`, session: (/7|9/.test(cleanU)?'morning':'afternoon'), color: '#0d9488' };
      state.classes = state.classes || [];
      state.classes.push(foundCls);
      saveState(false);
    }
    localAcc = { id: uid('acc'), username, password, fullname: foundCls.teacherName || `GVCN ${foundCls.name}`, role: 'teacher', assignedClass: foundCls.id, assignedGroup: '*', status: 'active', phone: '', updatedAt: new Date().toISOString() };
    state.accounts = state.accounts || [];
    state.accounts.push(localAcc);
    saveState(false);
  }
  if (localAcc) {
    localAcc.password = password;
    if (localAcc.assignedClass && localAcc.assignedClass !== '*') {
      state.activeClassId = localAcc.assignedClass;
    }
    state.currentPage = 'home';
    document.body.classList.remove('not-authenticated');
    saveUserSession(localAcc);
    applyUserPermissions();
    hideModal();
    toast(`Đăng nhập thành công: ${localAcc.fullname}!`);
  }
}

function autoLoginGroupLeader(classId, group, pin){
  const cleanSuffix = classId.replace(/^class_/, '').toLowerCase();
  const tNum = group.replace(/[^0-9]/g, '') || '1';
  let foundCls = state.classes.find(c => c.id === classId || c.name.toLowerCase() === cleanSuffix);
  if (!foundCls) {
    foundCls = { id: classId, name: cleanSuffix.toUpperCase(), grade: `Khối ${cleanSuffix[0] || '8'}`, year: '2026 - 2027', teacherName: `GVCN ${cleanSuffix.toUpperCase()}`, session: (/7|9/.test(cleanSuffix)?'morning':'afternoon'), color: '#0d9488' };
    state.classes = state.classes || [];
    state.classes.push(foundCls);
    saveState(false);
  }
  let localAcc = (state.accounts || DEFAULT_ACCOUNTS).find(a => a.role === 'group_leader' && a.assignedClass === classId && a.assignedGroup === group);
  if (!localAcc) {
    localAcc = {
      id: uid('acc'),

      password: pin,
      pin: pin,
      fullname: `Tổ Trưởng ${group} (${cleanSuffix.toUpperCase()})`,
      role: 'group_leader',

    };

    state.accounts.push(localAcc);

function handleUrlParams(){
  if (typeof window === 'undefined' || !window.location.search) return false;
  const params = new URLSearchParams(window.location.search);

  const rawU = (params.get('u') || params.get('user') || params.get('username') || '').trim();
  const rawP = (params.get('p') || params.get('pass') || params.get('password') || '').trim();
  const rawClass = (params.get('class') || params.get('lop') || '').trim();
  const rawPin = (params.get('pin') || '').trim();
  const rawGroup = (params.get('group') || params.get('to') || '').trim();
  const isPinTab = rawPin || params.get('tab') === 'pin' || rawGroup;
  const forceLogout = params.get('logout') === '1' || params.has('logout');
  const forceLogin = params.get('login') === '1' || params.has('login');

  if (forceLogout) {
    sessionStorage.removeItem('gvcn_user_session');
    localStorage.removeItem('gvcn_user_session');
    currentUser = null;
    window.currentUser = null;
  }

  // 1. Xác định lớp học yêu cầu (nếu có)
  let targetClassId = '';
  if (rawClass) {
    const cleanC = rawClass.toLowerCase().replace(/^class_/, '');
    let foundC = state.classes.find(c => c.id.toLowerCase() === rawClass.toLowerCase() || c.id.toLowerCase() === `class_${cleanC}` || c.name.toLowerCase() === cleanC);
    if (!foundC) {
      foundC = {
        id: `class_${cleanC}`,
        name: cleanC.toUpperCase(),
        grade: `Khối ${cleanC[0] || '8'}`,
        year: '2026 - 2027',
        teacherName: `GVCN ${cleanC.toUpperCase()}`,
        session: (/7|9/.test(cleanC) ? 'morning' : 'afternoon'),
        color: '#0d9488'
      };
      state.classes = state.classes || [];
      state.classes.push(foundC);
      saveState(false);
    }
    targetClassId = foundC.id;
    state.activeClassId = foundC.id;
  }

  // 2. Xác định tên đăng nhập
  let targetUsername = rawU;
  if (targetUsername) {
    const cleanU = targetUsername.toLowerCase().trim();
    const matchedAcc = findMatchingAccount(state.accounts || DEFAULT_ACCOUNTS, cleanU);
    if (matchedAcc) targetUsername = matchedAcc.username;
  } else if (targetClassId && !isPinTab) {
    const cleanSuffix = targetClassId.replace(/^class_/, '').toLowerCase();
    targetUsername = `gv_${cleanSuffix}`;
  }

  // 3. Xác định Tổ
  let targetGroupStr = '';
  if (rawGroup) {
    const num = rawGroup.replace(/[^0-9]/g, '');
    targetGroupStr = num ? `Tổ ${num}` : rawGroup;
  }

  // 4. Nếu có sẵn mật khẩu trong link: ĐĂNG NHẬP 1-CHẠM NGAY!
  if (targetUsername && rawP) {
    autoLoginTeacher(targetUsername, rawP);
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e){}
    return true;
  }

  if (isPinTab && rawPin && rawPin.length >= 4 && targetClassId && targetGroupStr) {
    autoLoginGroupLeader(targetClassId, targetGroupStr, rawPin);
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e){}
    return true;
  }

  // 5. Nếu link chỉ định tài khoản khác với tài khoản đang lưu
  if (targetUsername && currentUser && currentUser.username.toLowerCase() !== targetUsername.toLowerCase()) {
    sessionStorage.removeItem('gvcn_user_session');
    localStorage.removeItem('gvcn_user_session');
    currentUser = null;
    window.currentUser = null;
  }

  // 6. Điền sẵn thông tin vào cổng đăng nhập nếu có chỉ định từ link
  if (forceLogin || targetUsername || targetClassId || isPinTab) {
    window.pendingLoginOptions = {
      targetUser: targetUsername,
      targetClass: targetClassId,
      isPin: !!isPinTab,
      targetGroup: targetGroupStr,
      notice: targetUsername ? `Bạn đang mở link đăng nhập cho tài khoản: <b>${esc(targetUsername)}</b>. Vui lòng nhập mật khẩu.` : (targetClassId ? `Bạn đang mở link cho lớp <b>${esc(targetClassId.replace(/^class_/,'').toUpperCase())}</b>. Vui lòng đăng nhập để tiếp tục.` : '')
    };
    if (currentUser) {
      showLoginModal(window.pendingLoginOptions);
    }
    return true;
  }

  return false;
}

function findMatchingAccount(accountsList, inputUsername) {
  if (!Array.isArray(accountsList)) return null;
  const raw = String(inputUsername || '').trim();
  if (!raw) return null;
  const u = raw.toLowerCase();
  const cleanU = u.replace(/^gv[_]?/, '').replace(/^class[_]?/, '');

  // 1. Khớp chính xác username (không phân biệt hoa thường)
  let found = accountsList.find(a => String(a.username || '').trim().toLowerCase() === u);
  if (found) return found;

  // 2. Khớp có/không có tiền tố gv_ (ví dụ người dùng gõ "8a3" hoặc "gv8a3" thay vì "gv_8a3")
  found = accountsList.find(a => {
    const accU = String(a.username || '').trim().toLowerCase();
    const cleanAccU = accU.replace(/^gv[_]?/, '').replace(/^class[_]?/, '');
    return cleanAccU === cleanU || accU === ('gv_' + cleanU) || ('gv_' + accU) === u;
  });
  if (found) return found;

  // 3. Khớp theo mã lớp hoặc tên lớp được phân công (ví dụ gõ "8A3" và giáo viên được phân công lớp 8A3)
  found = accountsList.find(a => {
    if (a.role !== 'teacher') return false;
    const clsId = String(a.assignedClass || '').toLowerCase().replace(/^class_/, '');
    return clsId === cleanU;
  });
  if (found) return found;

  // 4. Nếu chưa tìm thấy nhưng người dùng nhập dạng gv_... hoặc mã lớp (VD: 8a3, 8A6, gv_8a3...)
  const classes = (state && Array.isArray(state.classes)) ? state.classes : [];
  const matchedCls = classes.find(c => {
    const cName = String(c.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const cId = String(c.id || '').toLowerCase().replace(/^class_/, '');
    return cName === cleanU || cId === cleanU;
  });
  if (matchedCls) {
    const autoUsername = 'gv_' + (matchedCls.name || cleanU).toLowerCase().replace(/[^a-z0-9]/g, '');
    let existing = (state.accounts || []).find(a => a.username.toLowerCase() === autoUsername);
    if (existing) return existing;
    const newTeacherAcc = {
      id: uid('acc'),
      username: autoUsername,
      password: '123456',
      fullname: (matchedCls.teacherName && matchedCls.teacherName !== 'Chưa phân công') ? `${matchedCls.teacherName} (GVCN ${matchedCls.name})` : `GVCN ${matchedCls.name}`,
      role: 'teacher',
      assignedClass: matchedCls.id,
      assignedGroup: '*',
      status: 'active',
      phone: '',
      updatedAt: new Date().toISOString()
    };
    if (state && Array.isArray(state.accounts)) {
      state.accounts.push(newTeacherAcc);
      saveState(false);
    }
    return newTeacherAcc;
  }

  // 5. Nếu gõ tên lớp hợp lệ như 8a3, 8A6 nhưng chưa có trong danh sách
  if (/^[6-9][a-z0-9]+$/i.test(cleanU)) {
    const clsName = cleanU.toUpperCase();
    const autoUsername = 'gv_' + cleanU.toLowerCase();
    let existing = (state.accounts || []).find(a => a.username.toLowerCase() === autoUsername);
    if (existing) return existing;
    const newTeacherAcc = {
      id: uid('acc'),
      username: autoUsername,
      password: '123456',
      fullname: `GVCN ${clsName}`,
      role: 'teacher',
      assignedClass: 'class_' + cleanU.toLowerCase(),
      assignedGroup: '*',
      status: 'active',
      phone: '',
      updatedAt: new Date().toISOString()
    };
    if (state && Array.isArray(state.accounts)) {
      state.accounts.push(newTeacherAcc);
      saveState(false);
    }
    return newTeacherAcc;
  }

  return null;
}

let isLoggingIn = false;
async function handleLoginSubmit(e){
  if(e){
    try { e.preventDefault(); } catch(err){}
    try { if(typeof e.stopPropagation === 'function') e.stopPropagation(); } catch(err){}
  }
  if(isLoggingIn) return;
  isLoggingIn = true;
  try {
    const rawU = (document.getElementById('loginUsername')?.value || '').trim();
    const p = (document.getElementById('loginPassword')?.value || '').trim();

    if(!rawU) return toast('Vui lòng nhập tên đăng nhập', 'warning');
    if(!p) return toast('Vui lòng nhập mật khẩu', 'warning');

    // Chuẩn hóa danh sách tài khoản cục bộ & tìm kiếm thông minh
    const accountsList = (state && Array.isArray(state.accounts) && state.accounts.length) ? state.accounts : DEFAULT_ACCOUNTS;
    let localAcc = findMatchingAccount(accountsList, rawU);

    // Đảm bảo admin hoặc gv_8a6 luôn có tài khoản đối chiếu
    const uLower = rawU.toLowerCase().trim();
    const cleanU = uLower.replace(/^gv[_]?/, '').replace(/^class[_]?/, '');
    if (!localAcc) {
      if (uLower === 'admin') {
        localAcc = { id: 'acc_admin', username: 'admin', password: 'admin123', fullname: 'Ban Giám Hiệu', role: 'admin', assignedClass: '*', assignedGroup: '*', status: 'active', phone: '', updatedAt: new Date().toISOString() };
        state.accounts = state.accounts || [];
        state.accounts.unshift(localAcc);
      } else if (uLower === 'gv_8a6' || cleanU === '8a6') {
        localAcc = { id: 'acc_gv_8a6', username: 'gv_8a6', password: '123456', fullname: 'Lê Tâm (GVCN 8A6)', role: 'teacher', assignedClass: 'class_8a6', assignedGroup: '*', status: 'active', phone: '', updatedAt: new Date().toISOString() };
        state.accounts = state.accounts || [];
        state.accounts.push(localAcc);
      }
    }

    // Khớp mật khẩu: hỗ trợ mật khẩu tùy chỉnh HOẶC mật khẩu mặc định hệ thống
    const isMatchLocal = localAcc && (
      String(localAcc.password).trim() === p ||
      String(localAcc.pin || '').trim() === p ||
      (localAcc.role === 'admin' && (p === 'admin123' || p === '123456' || p === '123')) ||
      (localAcc.role === 'teacher' && p === '123456') ||
      (localAcc.role === 'group_leader' && p === '1234')
    );

    // 1. NẾU TÀI KHOẢN CỤC BỘ KHỚP MẬT KHẨU: ĐĂNG NHẬP NGAY TỨC THÌ!
    if(localAcc && isMatchLocal){
      if(localAcc.status === 'locked'){
        return Swal.fire({
          icon: 'error',
          title: 'Tài khoản bị khóa',
          text: 'Tài khoản này đã bị Quản trị viên tạm khóa. Vui lòng liên hệ Ban Giám Hiệu.'
        });
      }

      // Nếu người dùng đăng nhập bằng mật khẩu mặc định, đồng bộ lại mật khẩu lưu trữ
      if (localAcc.password !== p && (p === 'admin123' || p === '123456' || p === '1234')) {
        localAcc.password = p;
        if (localAcc.role === 'group_leader') localAcc.pin = p;
        saveState(false);
      }

      if (localAcc.assignedClass && localAcc.assignedClass !== '*') {
        state.activeClassId = localAcc.assignedClass;
      }
      state.currentPage = localAcc.role === 'group_leader' ? 'competition' : 'home';
      document.body.classList.remove('not-authenticated');
      saveUserSession(localAcc);
      applyUserPermissions();
      hideModal();
      toast(`Đăng nhập thành công: ${localAcc.fullname}!`);

      // Tự động đẩy tài khoản này lên Cloud để đồng bộ ngay (không chặn UI)
      if(state.settings?.gasApiUrl){
        callGasApi('save_account', { accountData: localAcc });
        callGasApi('update_teacher_password', {
          username: localAcc.username,
          newPassword: p,
          fullname: localAcc.fullname,
          role: localAcc.role,
          assignedClass: localAcc.assignedClass,
          assignedGroup: localAcc.assignedGroup
        });
        pullClassDataFromCloud(false);
      }
      return;
    }

    // 2. NẾU CỤC BỘ CHƯA KHỚP: Thử xác thực qua Cloud Google Apps Script
    let cloudSuccess = false;
    let cloudUser = null;
    let cloudErrorMsg = '';

    if(state.settings?.gasApiUrl){
      Swal.fire({
        title: 'Đang xác thực...',
        text: 'Đang kiểm tra dữ liệu tài khoản...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const res = await callGasApi('login', { username: rawU, password: p });
        if(res && res.status === 'success' && res.user){
          cloudSuccess = true;
          cloudUser = res.user;
        } else if(res && res.status === 'error'){
          cloudErrorMsg = res.message || '';
        }
      } catch(err) {
        console.warn('Lỗi gọi API Cloud login:', err);
      }
    }

    // 3. Nếu Cloud khớp thông tin
    if(cloudSuccess && cloudUser){
      state.accounts = state.accounts || [];
      const idx = state.accounts.findIndex(a => a.username.toLowerCase() === cloudUser.username.toLowerCase());
      if (idx >= 0) {
        state.accounts[idx] = Object.assign(state.accounts[idx], cloudUser, { password: p });
      } else {
        state.accounts.push(Object.assign({ id: uid('acc'), password: p, status: 'active' }, cloudUser));
      }
      saveState(false);

      if (cloudUser.assignedClass && cloudUser.assignedClass !== '*') {
        state.activeClassId = cloudUser.assignedClass;
      }
      state.currentPage = cloudUser.role === 'group_leader' ? 'competition' : 'home';
      document.body.classList.remove('not-authenticated');
      saveUserSession(cloudUser);
      applyUserPermissions();
      if (Swal.isVisible()) Swal.close();
      hideModal();
      toast('Đăng nhập thành công: ' + cloudUser.fullname);
      pullClassDataFromCloud(false);
      return;
    }

    // 4. Nếu cả Cloud và Cục bộ đều sai
    if (Swal.isVisible()) Swal.close();
    Swal.fire({
      icon: 'error',
      title: 'Đăng nhập thất bại',
      html: `<div class="text-center">
        <p class="mb-2 text-danger fw-bold">${cloudErrorMsg || 'Tên đăng nhập hoặc mật khẩu không chính xác.'}</p>
        <div class="small text-muted">Vui lòng kiểm tra lại thông tin hoặc liên hệ Quản trị viên để được hỗ trợ.</div>
      </div>`
    });
  } finally {
    isLoggingIn = false;
  }
}
let isPinLoggingIn = false;

          targetGroup: group,
          pin: pin
        });

          cloudSuccess = true;
          cloudUser = res.user;
        } else if(res && res.status === 'error'){
          cloudErrorMsg = res.message || '';
        }
      } catch(err) {

      }
    }

      applyUserPermissions();
      hideModal();
      toast(`Đăng nhập thành công: ${cloudUser.fullname}!`);

function applyUserPermissions(){
  if(!currentUser) {
    document.body.classList.add('not-authenticated');
    return;
  }
  document.body.classList.remove('not-authenticated');

  if(currentUser.role === 'group_leader'){
    if(currentUser.assignedClass && currentUser.assignedClass !== '*'){
      state.activeClassId = currentUser.assignedClass;
    }
    // Cho phép Tổ trưởng vào: Trang chủ, Chấm điểm tổ, Học sinh lớp, Điểm danh, TKB, Đổi quà
    const allowedPages = ['home', 'competition', 'students', 'attendance', 'timetable', 'rewards'];
    if(!allowedPages.includes(state.currentPage)){
      state.currentPage = 'competition';
    }
  } else if(currentUser.role === 'teacher'){
    if(currentUser.assignedClass && currentUser.assignedClass !== '*'){
      const cleanTarget = currentUser.assignedClass.toLowerCase().replace(/^class_/, '');
      let found = state.classes.find(c => c.id.toLowerCase() === currentUser.assignedClass.toLowerCase() || c.name.toLowerCase() === cleanTarget || c.id.toLowerCase() === `class_${cleanTarget}`);
      if(!found){
        found = {
          id: `class_${cleanTarget}`,
          name: cleanTarget.toUpperCase(),
          grade: `Khối ${cleanTarget[0] || '8'}`,
          year: '2026 - 2027',
          teacherName: currentUser.fullname || `GVCN ${cleanTarget.toUpperCase()}`,
          session: (/7|9/.test(cleanTarget) ? 'morning' : 'afternoon'),
          color: '#0d9488'
        };
        state.classes.push(found);
        saveState(false);
      }
      state.activeClassId = found.id;
    }
    if(state.currentPage === 'accounts'){
      state.currentPage = 'home';
    }
  }
  buildNav();
  renderHeader();
  renderPage();
}
function logoutUser(force = false){
  const doLogout = () => {
    sessionStorage.removeItem('gvcn_user_session');
    localStorage.removeItem('gvcn_user_session');
    currentUser = null;
    if(typeof window !== 'undefined') window.currentUser = null;
    window.pendingLoginOptions = { notice: 'Bạn đã đăng xuất tài khoản an toàn. Vui lòng đăng nhập để tiếp tục.' };

  Swal.fire({
    icon: 'question',
    title: 'Đăng xuất?',
    text: 'Bạn có chắc chắn muốn đăng xuất tài khoản hiện tại?',
    showCancelButton: true,
    confirmButtonText: 'Đăng xuất',
    cancelButtonText: 'Hủy'
  }).then(r => {

    }
  });
}
async function callGasApi(action, payload = {}){
  const url = state.settings?.gasApiUrl || localStorage.getItem('gas_api_url') || '';
  if(!url) return null;
  try {
    updateSyncStatus('syncing');
    const fullPayload = {
      action,
      role: currentUser?.role || '',
      username: currentUser?.username || '',
      token: currentUser?.token || '',
      assignedGroup: currentUser?.assignedGroup || '',
      ...payload
    };
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(fullPayload)
    });
    const json = await res.json();
    updateSyncStatus('synced');
    return json;
  } catch(err){
    console.warn('Lỗi đồng bộ Google Sheets:', err);
    updateSyncStatus('error');
    return null;
  }
}
function updateSyncStatus(status){
  const p = document.getElementById('savePill');
  if(!p) return;
  if(status === 'syncing'){
    p.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Đang lưu Cloud...';
    p.style.background = '#fef3c7'; p.style.color = '#b45309';
  } else if(status === 'synced'){
    p.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-1"></i>Google Sheets ' + nowTime();
    p.style.background = '#ecfdf5'; p.style.color = '#047857';
  } else if(status === 'error'){
    p.innerHTML = '<i class="fa-solid fa-circle-exclamation me-1"></i>Lưu cục bộ ' + nowTime();
    p.style.background = '#fff1f2'; p.style.color = '#be123c';
  } else {
    p.innerHTML = '<i class="fa-solid fa-circle-check me-1"></i>Đã lưu ' + nowTime();
    p.style.background = '#ecfdf5'; p.style.color = '#047857';
  }
}
function saveState(show=true){try{state.version=APP_SCHEMA_VERSION;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateSyncStatus('saved');return true}catch(e){console.error(e);Swal.fire({icon:'error',title:'Không thể lưu dữ liệu',text:'Bộ nhớ trình duyệt có thể đã đầy. Hãy xuất JSON sao lưu và giảm kích thước ảnh đại diện.'});return false}}
function activeClass(){return state.classes.find(c=>c.id===state.activeClassId)||state.classes[0]||{id:'class_8a6',name:'8A6',grade:'Khối 8',year:'2026 - 2027'}}
function classStudents(){return state.students.filter(s=>s.classId===state.activeClassId)}

function toast(title,icon='success'){Swal.fire({toast:true,position:'top-end',icon,title,showConfirmButton:false,timer:1600,timerProgressBar:true})}
function beep(freq=660,dur=.18,vol=.12){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.connect(g);g.connect(ac.destination);g.gain.value=vol;o.start();setTimeout(()=>{o.stop();ac.close()},dur*1000)}catch(e){}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function buildNav(){
  const sn = document.getElementById('sideNav');
  if(!sn) return;
  if(!currentUser){
    sn.innerHTML = '';
    return;
  }
  const n=classStudents().length;
  let navItems = NAV;
  if(currentUser?.role === 'group_leader'){
    const allowed = ['home', 'competition', 'students', 'attendance', 'timetable', 'rewards'];
    navItems = NAV.filter(([id]) => allowed.includes(id));
  } else if(currentUser?.role !== 'admin'){
    navItems = NAV.filter(([id]) => id !== 'accounts');
  }
  sn.innerHTML=navItems.map(([id,ic,label,b])=>{
    let displayLabel = label;
    if(currentUser?.role === 'group_leader' && id === 'competition'){
      displayLabel = 'Chấm điểm tổ';
    }
    if(currentUser?.role === 'group_leader' && id === 'students'){
      displayLabel = 'Học sinh cả lớp';
    }
    return `<a class="nav-link ${state.currentPage===id?'active':''}" data-page="${id}" onclick="navigate('${id}')"><i class="fa-solid ${ic}"></i><span>${displayLabel}</span>${b==='count'?`<span class="mini-badge new">${n}</span>`:b?`<span class="mini-badge ${b==='NEW'?'new':b==='ADMIN'?'bg-danger text-white':''}">${b}</span>`:''}</a>`;
  }).join('');
}

function classStudentsFor(id){return state.students.filter(s=>s.classId===id)}
function navigate(page){
  if(!currentUser){
    toast('Vui lòng đăng nhập để sử dụng tính năng!', 'warning');
    const u = document.getElementById('loginUsername');
    if(u) { u.focus(); }
    return;
  }
  if(page === 'accounts' && currentUser?.role !== 'admin'){
    return toast('Chỉ Quản trị viên (Admin) mới có quyền truy cập mục Quản trị GVCN', 'warning');
  }
  if(currentUser?.role === 'group_leader' && !['home', 'competition', 'students', 'attendance', 'timetable', 'rewards'].includes(page)){
    return toast('Tổ trưởng không có quyền truy cập mục này', 'warning');
  }
  if(state.currentPage==='noise'&&page!=='noise') stopMic();
  state.currentPage=page;
  saveState(false);

  renderHeader();
  renderPage();

  window.scrollTo({top:0,behavior:'smooth'});
}

function logTransaction(studentId,amount,reason='Điều chỉnh xu',subject='Ghi chung / Nề nếp'){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return 0;
  const before=Math.max(0,finiteNum(s.coins,0)),requested=finiteNum(amount,0),after=Math.max(0,before+requested),applied=after-before;
  if(!applied)return 0;
  s.coins=after;
  state.transactions.unshift({id:uid('tx'),classId:s.classId,studentId,studentName:s.name,amount:applied,reason,subject,time:new Date().toISOString()});
  saveState(false);
  return applied;
}

function drawHomeChart(){
  const ctx=document.getElementById('homeChart');
  if(!ctx)return;
  if(typeof Chart !== 'undefined' && typeof Chart.getChart === 'function'){
    const prev = Chart.getChart(ctx);
    if(prev) { try{ prev.destroy(); }catch(e){} }
  }
  const rows=competitionRows(weekStartDate(today())).slice(0,8);
  chartRefs.push(new Chart(ctx,{type:'bar',data:{labels:rows.map(r=>r.name.split(' ').slice(-2).join(' ')),datasets:[{label:'Điểm tuần',data:rows.map(r=>r.total),backgroundColor:'rgba(13,148,136,.65)',borderColor:'#0d9488',borderWidth:1,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:false,suggestedMin:60}}}}));

function saveClass(e, id){
  e.preventDefault();
  const name = document.getElementById('cName').value.trim();
  const teacherName = document.getElementById('cTeacherName').value.trim();
  const grade = document.getElementById('cGrade').value;
  const session = document.getElementById('cSession')?.value || 'auto';
  const year = document.getElementById('cYear').value.trim();
  const data = { name, teacherName, grade, year, session };

  let targetId = id;
  if(id){
    Object.assign(state.classes.find(x => x.id === id), data);
  } else {
    const cleanSuffix = name.toLowerCase().replace(/[^a-z0-9]/g, '');
    let nid = 'class_' + cleanSuffix;
    if(state.classes.some(c => c.id === nid)) {
      nid = uid('class');
    }
    targetId = nid;
    state.classes.push({ id: nid, ...data, color: '#0d9488' });
    if(!state.seating[nid]) {
      state.seating[nid] = { lanes: 4, seats: 8, mode: '2d', assignments: {} };
    }
    state.activeClassId = nid;
  }

  ensureLocalAccountsForClass(targetId, name, teacherName);
  saveState();
  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();
  toast('Đã lưu lớp học');

  callGasApi('save_class', {
    classData: { id: targetId, ...data }
  });
}

async function deleteClass(id){
  if(state.classes.length === 1) return toast('Phải giữ ít nhất một lớp', 'warning');
  const c = state.classes.find(x => x.id === id);
  const studentIds = state.students.filter(s => s.classId === id).map(s => s.id);
  const r = await Swal.fire({
    icon: 'warning',
    title: 'Xóa lớp học?',
    html: `<div class="text-start">Lớp <b>${esc(c?.name || '')}</b> và toàn bộ dữ liệu liên quan sẽ bị xóa: học sinh, điểm danh, sơ đồ, thời khóa biểu, xu, đổi quà và lịch sử trò chơi.</div>`,
    showCancelButton: true,
    confirmButtonText: 'Xóa toàn bộ',
    cancelButtonText: 'Hủy',
    confirmButtonColor: '#dc2626'
  });
  if(!r.isConfirmed) return;
  recoverySnapshot();
  state.classes = state.classes.filter(c => c.id !== id);
  state.students = state.students.filter(s => s.classId !== id);
  state.transactions = state.transactions.filter(x => x.classId !== id);
  state.redemptions = state.redemptions.filter(x => x.classId !== id);
  state.wheelHistory = state.wheelHistory.filter(x => x.classId !== id);
  state.filmHistory = state.filmHistory.filter(x => x.classId !== id);
  state.timetable.entries = state.timetable.entries.filter(x => x.classId !== id);
  state.competition.events = state.competition.events.filter(x => x.classId !== id);
  Object.keys(state.competition.snapshots || {}).forEach(k => {
    if(state.competition.snapshots[k]?.classId === id) delete state.competition.snapshots[k];
  });
  Object.keys(state.attendance).filter(k => k.startsWith(id + '_')).forEach(k => delete state.attendance[k]);
  delete state.seating[id];
  state.wheelExcluded = state.wheelExcluded.filter(x => !studentIds.includes(x));
  state.filmExcluded = state.filmExcluded.filter(x => !studentIds.includes(x));
  state.wheelSelected = (state.wheelSelected || []).filter(x => !studentIds.includes(x));
  if(state.activeClassId === id) state.activeClassId = state.classes[0].id;
  syncClassesAndAccounts(false);
  saveState();
  buildNav();
  renderHeader();
  renderPage();
  toast('Đã xóa lớp và dữ liệu liên quan');

  callGasApi('delete_class', { classId: id });
}

    { "STT": 5, "LỚP": "9A1", "GVCN": "Cô Phạm Hồng Nhung" }

function handleClassExcelFileSelected(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array', raw: false });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: false });

      if(!rows.length){
        return Swal.fire({ icon: 'warning', title: 'File trống', text: 'File Excel không có dòng dữ liệu nào.' });
      }

      parsedExcelClasses = [];
      const seenNames = new Set();

      rows.forEach((row, idx)=>{
        const keys = Object.keys(row);
        let stt = idx + 1, className = '', teacherName = '';

        keys.forEach(k=>{
          const ck = cleanHeaderKey(k);
          const val = String(row[k] || '').trim();
          if(['stt', 'sothutu', 'no'].includes(ck)) stt = Number(val) || (idx + 1);
          else if(['lop', 'tenlop', 'class', 'classname', 'tenlophoc', 'lophoc'].includes(ck)) className = val;
          else if(['gvcn', 'giaovienchunhiem', 'giaovien', 'tengvcn', 'teacher', 'gv', 'chunhiem'].includes(ck)) teacherName = val;
        });

        if(className && !seenNames.has(className.toLowerCase())){
          seenNames.add(className.toLowerCase());
          const cleanSuffix = className.toLowerCase().replace(/[^a-z0-9]/g, '');
          const classId = 'class_' + cleanSuffix;
          
          // Tự động nhận diện khối
          const m = className.match(/(\d+)/);
          const grade = m ? `Khối ${m[1]}` : 'Khối 6';
          const year = '2026 - 2027';

          // Kiểm tra xem lớp đã tồn tại trong state chưa
          const existing = state.classes.find(c => c.id === classId || c.name.toLowerCase() === className.toLowerCase());

          parsedExcelClasses.push({
            stt: Number(stt) || (idx + 1),
            id: existing ? existing.id : classId,
            name: className,
            grade: existing?.grade || grade,
            year: existing?.year || year,
            teacherName: teacherName || existing?.teacherName || '',
            isExisting: !!existing,
            account: `gv_${cleanSuffix}`
          });
        }
      });

      if(!parsedExcelClasses.length){
        return Swal.fire({ icon: 'error', title: 'Không đọc được dữ liệu lớp', text: 'Vui lòng kiểm tra lại tiêu đề cột "LỚP" trong file Excel.' });
      }

      document.getElementById('classExcelPreviewArea').style.display = 'block';
      document.getElementById('classExcelStats').innerHTML = `<i class="fa-solid fa-school text-primary me-1"></i>Phát hiện: <b>${parsedExcelClasses.length}</b> lớp học`;

      const tbody = document.querySelector('#classExcelPreviewTable tbody');
      tbody.innerHTML = parsedExcelClasses.map(c => `<tr>
        <td><b>${c.stt}</b></td>
        <td><b class="text-primary">${esc(c.name)}</b></td>
        <td><span class="badge bg-light text-dark border">${esc(c.grade)}</span></td>
        <td>${esc(c.teacherName || '<Chưa nhập>')}</td>
        <td><code class="text-success">${c.account}</code></td>
        <td>${c.isExisting ? '<span class="badge bg-info text-dark">Cập nhật</span>' : '<span class="badge bg-success">Lớp mới</span>'}</td>
      </tr>`).join('');

    } catch (err) {
      console.error(err);
      Swal.fire({ icon: 'error', title: 'Lỗi đọc file', text: 'Không thể xử lý file Excel. Hãy kiểm tra định dạng file.' });
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmClassesExcelImport(){
  if(!parsedExcelClasses.length) return;
  const isOverwrite = document.getElementById('classModeOverwrite')?.checked;

  recoverySnapshot();

  if(isOverwrite){
    const newClassIds = new Set(parsedExcelClasses.map(c => c.id));
    state.classes = parsedExcelClasses.map(c => ({
      id: c.id,
      name: c.name,
      grade: c.grade,
      year: c.year,
      teacherName: c.teacherName,
      color: '#0d9488'
    }));
    state.students = state.students.filter(s => newClassIds.has(s.classId));
  } else {
    parsedExcelClasses.forEach(item => {
      const idx = state.classes.findIndex(c => c.id === item.id || c.name.toLowerCase() === item.name.toLowerCase());
      if(idx >= 0){
        if(item.teacherName) state.classes[idx].teacherName = item.teacherName;
        if(item.grade) state.classes[idx].grade = item.grade;
        if(item.year) state.classes[idx].year = item.year;
      } else {
        state.classes.push({
          id: item.id,
          name: item.name,
          grade: item.grade,
          year: item.year,
          teacherName: item.teacherName,
          color: '#0d9488'
        });
      }
    });
  }

  // Đảm bảo sơ đồ chỗ ngồi cho tất cả các lớp
  state.classes.forEach(c => {
    if(!state.seating[c.id]){
      state.seating[c.id] = { lanes: 4, seats: 8, mode: '2d', assignments: {} };
    }
  });

  // Đồng bộ toàn bộ tài khoản GVCN và Tổ Trưởng tương ứng với danh sách lớp
  syncClassesAndAccounts(true);

  if(!state.classes.some(c => c.id === state.activeClassId)){
    state.activeClassId = state.classes[0].id;
  }

  saveState();
  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();
  confettiLite();
  toast(`Đã xử lý nạp thành công ${parsedExcelClasses.length} lớp học!`);

  // Đồng bộ lên Google Apps Script CSDL toàn trường
  callGasApi('import_classes', {
    classes: parsedExcelClasses.map(c => ({
      id: c.id,
      name: c.name,
      grade: c.grade,
      year: c.year,
      teacherName: c.teacherName
    })),
    mode: isOverwrite ? 'overwrite' : 'merge'
  });

  // Tự động đẩy danh sách tài khoản mới lên bảng USERS trên Cloud (nếu có cấu hình)
  if (state.settings?.gasApiUrl || localStorage.getItem('gas_api_url')) {
    callGasApi('sync_all_accounts', { accounts: state.accounts });
  }
}

function maskCCCD(c){
  const str = String(c || '').trim();
  if(!str) return '<span class="text-muted">Chưa có</span>';
  if(str.length >= 8){
    return `${str.slice(0,4)}••••${str.slice(-4)}`;
  }
  return str;
}

async function saveStudent(e,id){
  e.preventDefault();
  let avatar = document.getElementById('sAvatarOld').value;
  const f = document.getElementById('sAvatar').files[0];
  if(f){
    if(f.size > 1200000){
      return Swal.fire({icon:'warning',title:'Ảnh quá lớn',text:'Vui lòng chọn ảnh dưới 1,2 MB để tránh đầy bộ nhớ trình duyệt.'});
    }
    avatar = await readFileData(f);
  }
  const desiredCoins = Math.max(0, +document.getElementById('sCoins').value || 0);
  let cccd = document.getElementById('sCccd').value.trim();
  if(cccd.length > 0 && cccd.length < 12 && /^\d+$/.test(cccd)){
    cccd = cccd.padStart(12, '0');
  }
  const d = {
    stt: Math.max(1, +document.getElementById('sStt').value || 1),
    name: document.getElementById('sName').value.trim(),
    dob: document.getElementById('sDob').value.trim(),
    gender: document.getElementById('sGender').value,
    cccd: cccd,
    avatar,
    note: document.getElementById('sNote').value.trim(),
    favorite: document.getElementById('sFav').checked
  };
  let savedStudent;
  if(id){
    const s = state.students.find(x=>x.id===id);
    const before = s.coins||0;
    Object.assign(s, d);
    savedStudent = s;
    const delta = desiredCoins - before;
    if(delta) logTransaction(id, delta, 'Điều chỉnh số dư từ hồ sơ', 'Ghi chung / Nề nếp');
  } else {
    const s = { id: uid('s'), classId: state.activeClassId, ...d, coins: 0 };
    state.students.push(s);
    savedStudent = s;
    if(desiredCoins) logTransaction(s.id, desiredCoins, 'Số dư ban đầu', 'Ghi chung / Nề nếp');
  }
  saveState();
  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();
  toast('Đã lưu học sinh');

  // Sync to Google Sheets
  callGasApi('save_student', { classId: state.activeClassId, student: savedStudent });
}

function readFileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function deleteStudent(id){
  const s = state.students.find(x=>x.id===id);
  const r = await Swal.fire({
    icon:'warning',
    title:'Xóa học sinh?',
    html:`<div class="text-start"><b>${esc(s?.name||'')}</b>${s?.cccd?`<br><small class="text-muted">CCCD: ${esc(s.cccd)}</small>`:''}<br><small>Điểm danh, thi đua và vị trí ngồi của học sinh này sẽ bị xóa.</small></div>`,
    showCancelButton:true,
    confirmButtonText:'Xóa toàn bộ',
    confirmButtonColor:'#dc2626'
  });
  if(!r.isConfirmed) return;
  recoverySnapshot();
  state.students = state.students.filter(x=>x.id!==id);
  Object.values(state.seating).forEach(cfg=>Object.keys(cfg.assignments||{}).forEach(k=>{if(cfg.assignments[k]===id)delete cfg.assignments[k]}));
  Object.values(state.attendance).forEach(row=>{if(row&&typeof row==='object')delete row[id]});
  state.transactions = state.transactions.filter(x=>x.studentId!==id);
  state.redemptions = state.redemptions.filter(x=>x.studentId!==id);
  state.wheelHistory = state.wheelHistory.filter(x=>x.studentId!==id);
  state.filmHistory = state.filmHistory.filter(x=>x.studentId!==id);
  state.competition.events = state.competition.events.filter(x=>x.studentId!==id);
  if(state.competition.groupAssignments) delete state.competition.groupAssignments[id];
  state.wheelExcluded = state.wheelExcluded.filter(x=>x!==id);
  state.filmExcluded = state.filmExcluded.filter(x=>x!==id);
  state.wheelSelected = (state.wheelSelected||[]).filter(x=>x!==id);
  saveState();
  buildNav();
  renderHeader();
  renderPage();
  toast('Đã xóa học sinh');

  // Sync delete to Google Sheets
  callGasApi('delete_student', { classId: state.activeClassId, studentId: id });
}

function handleExcelFileSelected(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: false });

      if(!rows.length){
        return Swal.fire({ icon: 'warning', title: 'File trống', text: 'File Excel không có dòng dữ liệu nào.' });
      }

      parsedExcelStudents = [];
      rows.forEach((row, idx)=>{
        const keys = Object.keys(row);
        let stt = idx + 1, name = '', dob = '', gender = '', cccd = '';

        keys.forEach(k=>{
          const ck = cleanHeaderKey(k);
          const val = String(row[k] || '').trim();
          if(['stt', 'sothutu', 'no'].includes(ck)) stt = Number(val) || (idx + 1);
          else if(['hoten', 'hovaten', 'tenhocsinh', 'tenhs', 'name', 'fullname', 'hotenhocsinh'].includes(ck)) name = val;
          else if(['ngaysinh', 'ngaythangnamsinh', 'dob', 'namsinh', 'ngay'].includes(ck)) dob = val;
          else if(['gioitinh', 'phai', 'gender', 'namnu', 'gt'].includes(ck)) gender = val;
          else if(['cccd', 'socccd', 'cancuoccongdan', 'cancuoc', 'dinhdanh', 'sodinhdanh', 'cmnd'].includes(ck)) cccd = val;
        });

        if(['nam', 'trai', 'boy', 'm', 'male'].includes(gender.toLowerCase())) gender = 'Nam';
        else if(['nu', 'gai', 'girl', 'f', 'female'].includes(gender.toLowerCase())) gender = 'Nữ';
        else if(!gender) gender = '';

        if(cccd.length > 0 && cccd.length < 12 && /^\d+$/.test(cccd)){
          cccd = cccd.padStart(12, '0');
        }

        if(dob.includes('T')){
          const d = new Date(dob);
          if(!isNaN(d.getTime())) {
            const z = n => String(n).padStart(2, '0');
            dob = `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()}`;
          }
        }

        if(name){
          parsedExcelStudents.push({
            id: uid('s'),
            classId: state.activeClassId,
            stt: Number(stt) || (idx + 1),
            name: name,
            dob: dob,
            gender: gender || 'Nữ',
            cccd: cccd,
            coins: 0,
            avatar: '',
            favorite: false,
            note: ''
          });
        }
      });

      if(!parsedExcelStudents.length){
        return Swal.fire({ icon: 'error', title: 'Không đọc được dữ liệu', text: 'Vui lòng kiểm tra lại tiêu đề cột "Họ và tên" trong file Excel.' });
      }

      document.getElementById('excelPreviewArea').style.display = 'block';
      document.getElementById('excelStats').innerHTML = `<i class="fa-solid fa-users text-success me-1"></i>Phát hiện: <b>${parsedExcelStudents.length}</b> học sinh`;
      
      const tbody = document.querySelector('#excelPreviewTable tbody');
      tbody.innerHTML = parsedExcelStudents.map((st, i)=>{
        const cccdValid = !st.cccd || st.cccd.length === 12;
        return `<tr>
          <td><b>${st.stt}</b></td>
          <td><b>${esc(st.name)}</b></td>
          <td>${esc(st.dob || '--/--/----')}</td>
          <td>${esc(st.gender)}</td>
          <td class="font-monospace">${esc(st.cccd || '--')}</td>
          <td>${cccdValid ? '<span class="badge bg-success">Hợp lệ</span>' : '<span class="badge bg-warning text-dark">CCCD ≠ 12 số</span>'}</td>
        </tr>`;
      }).join('');

    } catch (err) {
      console.error(err);
      Swal.fire({ icon: 'error', title: 'Lỗi đọc file', text: 'Không thể xử lý file Excel. Hãy kiểm tra định dạng file.' });
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmExcelImport(){
  if(!parsedExcelStudents.length) return;
  const isOverwrite = document.getElementById('modeOverwrite').checked;

  if(isOverwrite){
    state.students = state.students.filter(s => s.classId !== state.activeClassId).concat(parsedExcelStudents);
  } else {
    const currentMaxStt = Math.max(0, ...classStudents().map(s => s.stt || 0));
    parsedExcelStudents.forEach((st, i) => st.stt = currentMaxStt + i + 1);
    state.students.push(...parsedExcelStudents);
  }

  saveState();
  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();
  confettiLite();
  toast(`Đã nhập thành công ${parsedExcelStudents.length} học sinh!`);

  // Gửi lên Google Apps Script
  callGasApi('import_students', {
    classId: state.activeClassId,
    students: parsedExcelStudents,
    mode: isOverwrite ? 'overwrite' : 'append'
  });
}

function addCompetitionEvent(criterionId){
  if(weekClosed()) return toast('Tuần đã chốt','warning');
  const c = criterionById(criterionId);
  const sid = document.getElementById('competitionStudent')?.value;
  const st = state.students.find(x => x.id === sid);
  const date = document.getElementById('competitionDate')?.value || defaultEventDateForWeek(state.competition.activeWeek);
  const note = document.getElementById('competitionNote')?.value.trim() || '';
  if(!c || !st) return toast('Thiếu học sinh hoặc tiêu chí','warning');
  if(weekStartDate(date) !== weekStartDate(state.competition.activeWeek)) return toast('Ngày ghi nhận không thuộc tuần đang chọn','warning');

  const isGroupLeader = currentUser?.role === 'group_leader';
  if (isGroupLeader) {
    const myGroup = currentUser?.assignedGroup || 'Tổ 1';
    const stGroup = state.competition?.groupAssignments?.[st.id];
    if (stGroup && stGroup !== myGroup) {
      return toast(`Tổ trưởng chỉ được chấm điểm nề nếp cho thành viên thuộc ${myGroup}!`, 'warning');
    }
  }

  const eventStatus = isGroupLeader ? 'pending' : 'approved';
  const submittedBy = currentUser?.username || (isGroupLeader ? 'totruong' : 'gv');

  const ev = {
    id: uid('ce'),
    classId: state.activeClassId,
    studentId: st.id,
    studentName: st.name,
    date,
    weekStart: weekStartDate(date),
    criterionId: c.id,
    category: c.category,
    label: c.label,
    points: c.points,
    note,
    source: isGroupLeader ? 'group_leader' : 'manual',
    status: eventStatus,
    submittedBy: submittedBy,
    time: new Date().toISOString()
  };

  if(isGroupLeader){
    state.competition.pendingEvents = state.competition.pendingEvents || [];
    state.competition.pendingEvents.unshift(ev);
    saveState(false);
    renderPage();
    Swal.fire({
      icon: 'success',
      title: 'Đã gửi ghi nhận điểm!',
      html: `Đã chấm điểm cho <b>${esc(st.name)}</b>: <b class="${c.points >= 0 ? 'text-success' : 'text-danger'}">${c.points >= 0 ? '+' : ''}${c.points} điểm</b>.<br><span class="badge bg-warning text-dark mt-2"><i class="fa-solid fa-hourglass-half me-1"></i>Đang chờ GVCN phê duyệt</span>`,
      timer: 2500,
      showConfirmButton: false
    });
  } else {
    state.competition.events.unshift(ev);
    saveState(false);
    renderPage();
    toast(`${st.name}: ${c.points >= 0 ? '+' : ''}${c.points} điểm`);
  }

  callGasApi('save_competition_event', { event: ev });
}

async function deleteCompetitionEvent(id, isPending = false){
  if(weekClosed() && !isPending) return;

  if(isPending){
    const e = (state.competition.pendingEvents || []).find(x => x.id === id);
    const r = await Swal.fire({
      icon: 'warning',
      title: 'Rút lại ghi nhận này?',
      text: e ? `${e.studentName}: ${e.label}` : '',
      showCancelButton: true,
      confirmButtonText: 'Rút lại',
      confirmButtonColor: '#dc2626'
    });
    if(!r.isConfirmed) return;
    state.competition.pendingEvents = (state.competition.pendingEvents || []).filter(x => x.id !== id);
    saveState(false);
    renderPage();
    toast('Đã rút lại ghi nhận');
    callGasApi('delete_competition_event', { id });
    return;
  }

  const e = state.competition.events.find(x => x.id === id);
  const r = await Swal.fire({
    icon: 'warning',
    title: 'Xóa ghi nhận thi đua?',
    text: e ? `${e.studentName}: ${e.label}` : '',
    showCancelButton: true,
    confirmButtonText: 'Xóa',
    confirmButtonColor: '#dc2626'
  });
  if(!r.isConfirmed) return;
  state.competition.events = state.competition.events.filter(x => x.id !== id);
  saveState();
  renderPage();
  callGasApi('delete_competition_event', { id });
}

async function approveCompetitionEvent(id){
  state.competition.pendingEvents = state.competition.pendingEvents || [];
  const idx = state.competition.pendingEvents.findIndex(x => x.id === id);
  if(idx === -1) return;
  const ev = state.competition.pendingEvents.splice(idx, 1)[0];
  ev.status = 'approved';
  state.competition.events.unshift(ev);
  saveState(false);
  renderPage();
  toast(`Đã duyệt ghi nhận: ${ev.studentName} (${ev.points >= 0 ? '+' : ''}${ev.points}đ)`);
  callGasApi('approve_competition_events', { eventIds: [id], decision: 'approve' });
}

async function rejectCompetitionEvent(id){
  const r = await Swal.fire({
    icon: 'warning',
    title: 'Bác bỏ ghi nhận này?',
    text: 'Bản ghi do Tổ trưởng chấm sẽ bị hủy bỏ.',
    showCancelButton: true,
    confirmButtonText: 'Bác bỏ',
    confirmButtonColor: '#dc2626'
  });
  if(!r.isConfirmed) return;
  state.competition.pendingEvents = state.competition.pendingEvents || [];
  state.competition.pendingEvents = state.competition.pendingEvents.filter(x => x.id !== id);
  saveState(false);
  renderPage();
  toast('Đã bác bỏ bản ghi');
  callGasApi('approve_competition_events', { eventIds: [id], decision: 'reject' });
}

async function approveAllCompetitionEvents(){
  state.competition.pendingEvents = state.competition.pendingEvents || [];
  const classPending = state.competition.pendingEvents.filter(e => e.classId === state.activeClassId);
  if(!classPending.length) return toast('Không có bản ghi nào chờ duyệt', 'info');

  const r = await Swal.fire({
    icon: 'question',
    title: `Phê duyệt tất cả ${classPending.length} bản ghi?`,
    text: 'Toàn bộ điểm nề nếp do các Tổ trưởng chấm sẽ được cộng/trừ chính thức vào bảng thi đua lớp.',
    showCancelButton: true,
    confirmButtonText: 'Duyệt tất cả',
    confirmButtonColor: '#16a34a'
  });
  if(!r.isConfirmed) return;

  const ids = classPending.map(e => e.id);
  classPending.forEach(ev => {
    ev.status = 'approved';
    state.competition.events.unshift(ev);
  });
  state.competition.pendingEvents = state.competition.pendingEvents.filter(e => e.classId !== state.activeClassId);

  saveState(false);
  renderPage();
  toast(`Đã duyệt thành công ${ids.length} bản ghi!`);
  callGasApi('approve_competition_events', { eventIds: ids, decision: 'approve' });
}

async function saveGroupPins(e){
  e.preventDefault();
  const updates = [];
  document.querySelectorAll('.pin-input').forEach(el => {
    const grp = el.dataset.group;
    const pin = el.value.trim();
    if(grp && pin) updates.push({ group: grp, pin: pin });
  });

  // Cập nhật DEFAULT_ACCOUNTS và state.accounts cục bộ
  updates.forEach(u => {
    const acc = DEFAULT_ACCOUNTS.find(a => a.assignedClass === state.activeClassId && a.assignedGroup === u.group);
    if(acc) {
      acc.pin = u.pin;
      acc.password = u.pin;
    }
    if (state && Array.isArray(state.accounts)) {
      const sAcc = state.accounts.find(a => a.role === 'group_leader' && a.assignedClass === state.activeClassId && a.assignedGroup === u.group);
      if(sAcc) {
        sAcc.password = u.pin;
        sAcc.pin = u.pin;
        sAcc.updatedAt = new Date().toISOString();
      }
    }
  });
  saveState();

  mainModal.hide();
  toast('Đang lưu mã PIN...');

  const res = await callGasApi('update_group_pins', {
    classId: state.activeClassId,
    updates: updates
  });

  if(res && res.status === 'success'){
    Swal.fire({
      icon: 'success',
      title: 'Đã cập nhật mã PIN!',
      text: res.message || 'Mã PIN của các tổ trưởng đã được lưu thành công trên Google Sheets.'
    });
  } else {
    toast('Đã lưu mã PIN cục bộ', 'info');
  }
}

function seatingCfg(){
  if(!state.seating) state.seating = {};
  if(!state.seating[state.activeClassId]){
    state.seating[state.activeClassId] = defaultSeating(state.students, state.activeClassId);
  }
  const cfg = state.seating[state.activeClassId];
  if(!cfg.assignments || (Object.keys(cfg.assignments).length === 0 && !cfg.cleared)){
    const ss = classStudents();
    if(ss.length > 0){
      const def = defaultSeating(state.students, state.activeClassId);
      cfg.lanes = def.lanes;
      cfg.seats = def.seats;
      cfg.assignments = def.assignments;
      delete cfg.cleared;
      saveState(false);
    }
  }
  return cfg;
}

function renderSeating(){const cfg=seatingCfg(),ss=classStudents();const assigned=new Set(flattenDeskAssignments(cfg.assignments||{}));const unassigned=ss.filter(s=>!assigned.has(s.id));const positionCount=cfg.seats*2;return `<div class="section-head"><div><h2><i class="fa-solid fa-border-all text-primary me-2"></i>Sơ đồ chỗ ngồi ${esc(activeClass().name)}</h2><p>Bố cục mặc định 4 dãy; mỗi bàn xếp được <b>2 vị trí</b>. Bấm vào từng bàn để chọn học sinh cho vị trí 1 và vị trí 2.</p></div><div class="d-flex gap-2 flex-wrap"><div class="btn-group"><button class="btn ${cfg.mode==='3d'?'btn-primary':'btn-outline-primary'}" onclick="setSeatMode('3d')"><i class="fa-solid fa-cube"></i> 3D</button><button class="btn ${cfg.mode!=='3d'?'btn-primary':'btn-outline-primary'}" onclick="setSeatMode('2d')"><i class="fa-solid fa-layer-group"></i> 2D</button></div><select class="form-select" style="width:120px" onchange="setLanes(+this.value)">${[2,3,4,5,6].map(x=>`<option ${cfg.lanes===x?'selected':''} value="${x}">${x} Dãy</option>`).join('')}</select><select class="form-select" style="width:170px" onchange="setSeatCount(+this.value)">${[Math.max(4,Math.ceil(ss.length/2)),10,12,16,20,24,28].filter((x,i,a)=>x>0&&a.indexOf(x)===i).sort((a,b)=>a-b).map(x=>`<option ${cfg.seats===x?'selected':''} value="${x}">${x} bàn đôi</option>`).join('')}</select><span class="badge text-bg-light align-self-center">${positionCount} vị trí</span><button class="btn btn-outline-success fw-bold" onclick="resetDefaultSeating()"><i class="fa-solid fa-people-group me-1"></i>Xếp chuẩn theo tổ</button><button class="btn btn-outline-primary" onclick="randomSeat()"><i class="fa-solid fa-shuffle me-1"></i>Xếp ngẫu nhiên</button><button class="btn btn-outline-primary" onclick="seatGenderAlternating()"><i class="fa-solid fa-venus-mars me-1"></i>Nam–Nữ xen kẽ</button><button class="btn btn-outline-danger" onclick="clearSeats()"><i class="fa-solid fa-rotate-left me-1"></i>Xóa xếp chỗ</button><button class="btn btn-primary" onclick="exportSeatingPNG()"><i class="fa-solid fa-image me-1"></i>Xuất PNG</button></div></div><div class="grid-2"><div class="board-wrap" id="seatingExport"><div class="class-board ${cfg.mode==='3d'?'mode-3d':''}"><div class="chalkboard">✦ KỶ LUẬT · TRI THỨC · SÁNG TẠO ✦<br><span style="font-size:1.3rem">★ BẢNG LỚP ${esc(activeClass().name)} ★</span><br><small>${esc(state.teacher.school)} · Niên khóa: ${esc(activeClass().year)} · GVCN: ${esc(state.teacher.name)} · Sĩ số: ${ss.length}</small></div><div class="teacher-desk"><i class="fa-solid fa-desktop me-1"></i>BÀN GIÁO VIÊN<br><small>${esc(state.teacher.name)}</small></div><div class="seat-grid" style="grid-template-columns:repeat(${cfg.lanes},minmax(160px,1fr))">${Array.from({length:cfg.lanes},(_,lane)=>`<div class="seat-lane"><div class="lane-label">📌 DÃY ${lane+1}</div>${seatIndicesForLane(cfg.seats,cfg.lanes,lane).map(idx=>seatHtml(idx,cfg)).join('')}</div>`).join('')}</div></div></div><div class="card p-3"><h5 class="fw-bold">Học sinh chưa xếp (${unassigned.length})</h5><div class="small text-muted mb-2">Tổng ${ss.length} học sinh · ${positionCount} vị trí ngồi.</div>${unassigned.length?unassigned.map(s=>`<div class="d-flex align-items-center gap-2 border-bottom py-2">${renderAvatar(s,'mini-avatar')}<strong>${esc(s.name)}</strong></div>`).join(''):'<div class="alert alert-success">✓ Tất cả học sinh đã có chỗ ngồi!</div>'}</div></div>`}
function seatIndicesForLane(total,lanes,lane){const arr=[];for(let i=lane;i<total;i+=lanes)arr.push(i);return arr}
function seatHtml(idx,cfg){const desk=deskAssignment(cfg.assignments[idx]);const left=state.students.find(x=>x.id===desk.left),right=state.students.find(x=>x.id===desk.right);const shortName=s=>esc((s?.name||'').split(' ').slice(-2).join(' ')||'Trống');return `<div class="seat ${left||right?'filled':''}" onclick="chooseSeat(${idx})"><div><small>Bàn ${idx+1} · 2 vị trí</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div style="border:1.5px dashed ${left?'#2dd4bf':'#cbd5e1'};border-radius:14px;padding:8px;min-height:78px;background:${left?'#ecfeff':'#f8fafc'};display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><div class="small text-muted">Vị trí 1</div>${left?`${renderAvatar(left,'mini-avatar')}<strong style="font-size:.8rem">${shortName(left)}</strong>`:'<div class="text-muted small mt-1"><i class="fa-solid fa-plus"></i> Trống</div>'}</div><div style="border:1.5px dashed ${right?'#2dd4bf':'#cbd5e1'};border-radius:14px;padding:8px;min-height:78px;background:${right?'#ecfeff':'#f8fafc'};display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><div class="small text-muted">Vị trí 2</div>${right?`${renderAvatar(right,'mini-avatar')}<strong style="font-size:.8rem">${shortName(right)}</strong>`:'<div class="text-muted small mt-1"><i class="fa-solid fa-plus"></i> Trống</div>'}</div></div></div></div>`}

function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function seatGenderAlternating(){const cfg=seatingCfg(),ss=classStudents(),male=shuffled(ss.filter(s=>s.gender==='Nam')),female=shuffled(ss.filter(s=>s.gender==='Nữ')),other=shuffled(ss.filter(s=>s.gender!=='Nam'&&s.gender!=='Nữ'));const seq=[];let turn=male.length>=female.length?'Nam':'Nữ';while(male.length||female.length){if(turn==='Nam'&&male.length)seq.push(male.shift());else if(turn==='Nữ'&&female.length)seq.push(female.shift());else if(male.length)seq.push(male.shift());else if(female.length)seq.push(female.shift());turn=turn==='Nam'?'Nữ':'Nam'}seq.push(...other);cfg.lanes=4;cfg.seats=Math.max(cfg.seats,Math.ceil(seq.length/2));fillDeskSequence(seq.map(s=>s.id),cfg);saveState();renderPage();Swal.fire({icon:'success',title:'Đã xếp Nam–Nữ xen kẽ',html:`Đã xếp ${seq.length} học sinh theo nguyên tắc xen kẽ tối đa.<br><small>Bấm vào từng bàn để điều chỉnh thủ công nếu cần.</small>`,timer:2200,showConfirmButton:false})}

async function chooseSeat(idx){const cfg=seatingCfg();const current=deskAssignment(cfg.assignments[idx]);const currentIds=[current.left,current.right].filter(Boolean);const used=new Set(flattenDeskAssignments(cfg.assignments));currentIds.forEach(id=>used.delete(id));const options=classStudents().filter(s=>!used.has(s.id)||currentIds.includes(s.id));const opts=['<option value="">-- Để trống --</option>',...options.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`)].join('');const html=`<div class="text-start"><div class="small text-muted mb-2">Bàn ${idx+1} có 2 vị trí ngồi.</div><label class="form-label fw-bold">Vị trí 1</label><select id="deskLeft" class="form-select mb-3">${opts}</select><label class="form-label fw-bold">Vị trí 2</label><select id="deskRight" class="form-select">${opts}</select></div>`;await Swal.fire({title:'Chọn học sinh cho bàn '+(idx+1),html,showCancelButton:true,confirmButtonText:'Lưu xếp chỗ',didOpen:()=>{document.getElementById('deskLeft').value=current.left||'';document.getElementById('deskRight').value=current.right||''},preConfirm:()=>{const left=document.getElementById('deskLeft').value,right=document.getElementById('deskRight').value;if(left&&right&&left===right){Swal.showValidationMessage('Không thể chọn cùng một học sinh cho cả 2 vị trí');return false}cfg.assignments[idx]={left,right};if(!left&&!right)delete cfg.assignments[idx];saveState();renderPage();return true}})}

function resetSessionSlots(session){
  if(session === 'morning'){
    TIMETABLE_SLOT_META.forEach(slot => {
      const el = document.getElementById('slot_m_' + slot.id);
      if(el) el.value = TIMETABLE_SLOT_MORNING[slot.id];
    });
    toast('Đã nạp chuẩn Buổi Sáng THCS Quang Trung');
  } else {
    TIMETABLE_SLOT_META.forEach(slot => {
      const el = document.getElementById('slot_a_' + slot.id);
      if(el) el.value = TIMETABLE_SLOT_AFTERNOON[slot.id];
    });
    toast('Đã nạp chuẩn Buổi Chiều THCS Quang Trung');
  }
}

function resetAllSlotsToDefaultOfficial(){
  resetSessionSlots('morning');
  resetSessionSlots('afternoon');
  toast('Đã khôi phục toàn bộ chuẩn khung giờ Sáng & Chiều');
}

function saveTimetableConfig(e){
  e.preventDefault();
  state.timetable.slotTimesMorning = state.timetable.slotTimesMorning || {};
  state.timetable.slotTimesAfternoon = state.timetable.slotTimesAfternoon || {};
  TIMETABLE_SLOT_META.forEach(slot => {
    const elM = document.getElementById('slot_m_' + slot.id);
    if(elM) state.timetable.slotTimesMorning[slot.id] = elM.value.trim() || TIMETABLE_SLOT_MORNING[slot.id];
    const elA = document.getElementById('slot_a_' + slot.id);
    if(elA) state.timetable.slotTimesAfternoon[slot.id] = elA.value.trim() || TIMETABLE_SLOT_AFTERNOON[slot.id];
  });
  state.timetable.slotTimes = Object.assign({}, state.timetable.slotTimesAfternoon);
  const curSess = state.timetable.viewSession || getClassSession();
  const curSlotMap = curSess === 'morning' ? state.timetable.slotTimesMorning : state.timetable.slotTimesAfternoon;
  state.timetable.entries.forEach(x => {
    if(TIMETABLE_SLOT_META.some(s => s.id === x.slot)){
      x.time = curSlotMap[x.slot] || x.time;
    }
  });
  saveState();
  mainModal.hide();
  renderPage();
  toast('Đã lưu cấu hình khung giờ');
}

function openLessonModal(day,slot,id=''){

  if(!sl||!sl.editable)return;
  const e=state.timetable.entries.find(x=>x.id===id)||{subject:'',time:sl?.time||''};
  showModal(id?'Sửa tiết học':'Thêm tiết học',`
    <form onsubmit="saveLesson(event,${day},'${slot}','${id}')">
      <div class="mb-3">

        <div class="col-md-6">
          <label class="form-label fw-bold">Khung giờ tiết học (${sess==='morning'?'Sáng':'Chiều'})</label>
          <input id="lessonTime" class="form-control" value="${esc(e.time||sl.time)}">
        </div>
      </div>
      <div class="small text-muted mt-2">Mốc giờ chuẩn ${sess==='morning'?'Sáng':'Chiều'} của ${esc(sl.label)} là <b>${esc(sl.time)}</b>.</div>
      <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-primary">Lưu tiết học</button>
      </div>
    </form>
  `);
}

function saveLesson(e,day,slot,id){
  e.preventDefault();
  const sess = state.timetable.viewSession || getClassSession();
  const d={
    subject: document.getElementById('lessonSubject').value.trim(),
    time: document.getElementById('lessonTime').value.trim() || timetableSlotTime(slot, sess)
  };
  if(id) Object.assign(state.timetable.entries.find(x=>x.id===id), d);
  else state.timetable.entries.push({id:uid('tt'),classId:state.activeClassId,day,slot,...d});
  saveState();
  mainModal.hide();
  renderPage();
}

function deleteLesson(id){
  state.timetable.entries = state.timetable.entries.filter(x=>x.id!==id);
  saveState();
  mainModal.hide();
  renderPage();
}
function renderRewards(){return `<div class="section-head"><div><h2><i class="fa-solid fa-gift text-primary me-2"></i>Cửa hàng đổi quà</h2><p>Học sinh dùng xu tích lũy để đổi phần thưởng.</p></div><button class="btn btn-primary" onclick="openRewardModal()"><i class="fa-solid fa-plus me-1"></i>Thêm phần thưởng</button></div><div class="reward-grid">${state.rewards.map(r=>`<div class="card reward-card hover-lift"><div class="reward-visual">${esc(r.emoji||'🎁')}</div><div class="reward-body"><div class="d-flex justify-content-between"><h5 class="fw-bold">${esc(r.name)}</h5><span class="coin-pill">${r.cost} xu</span></div><div class="text-muted small">${r.stock>0?'Còn '+r.stock+' phần':'Hết quà'}</div><div class="d-flex gap-2 mt-3"><button class="btn btn-primary flex-fill" ${r.stock<=0?'disabled':''} onclick="redeemReward('${r.id}')">${r.stock>0?'Đổi phần thưởng':'Đã hết'}</button><button class="icon-btn" onclick="openRewardModal('${r.id}')"><i class="fa-solid fa-pen"></i></button><button class="icon-btn text-danger" onclick="deleteReward('${r.id}')"><i class="fa-solid fa-trash"></i></button></div></div></div>`).join('')}</div><div class="card p-3 mt-3"><h5 class="fw-bold">Lịch sử đổi quà</h5>${state.redemptions.filter(x=>x.classId===state.activeClassId).slice(0,20).map(x=>`<div class="history-item"><span><strong>${esc(x.studentName)}</strong> đổi ${esc(x.rewardName)}</span><span class="text-muted">-${x.cost} xu · ${new Date(x.time).toLocaleString('vi-VN')}</span></div>`).join('')||'<div class="empty">Chưa có lượt đổi quà</div>'}</div>`}
