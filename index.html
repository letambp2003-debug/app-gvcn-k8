async function redeemReward(rid){const r=state.rewards.find(x=>x.id===rid);if(!r)return toast('Không tìm thấy phần thưởng','error');if((r.stock||0)<=0)return Swal.fire({icon:'warning',title:'Phần thưởng đã hết',text:'Hãy cập nhật tồn kho trước khi đổi tiếp.'});const eligible=classStudents().filter(s=>(s.coins||0)>=r.cost);if(!eligible.length)return Swal.fire({icon:'info',title:'Chưa có học sinh đủ xu',text:`Cần ít nhất ${r.cost} xu để đổi ${r.name}.`});const {value:sid}=await Swal.fire({title:'Đổi quà cho học sinh',html:`<div class="fs-1 mb-2">${esc(r.emoji)}</div><strong>${esc(r.name)} (${r.cost} xu)</strong><div class="small text-muted mt-1">Tồn kho: ${r.stock}</div>`,input:'select',inputOptions:Object.fromEntries(eligible.map(s=>[s.id,`${s.name} (${s.coins} xu)`])),showCancelButton:true,confirmButtonText:'Xác nhận đổi quà'});if(!sid)return;const s=state.students.find(x=>x.id===sid);if(!s||r.stock<=0||(s.coins||0)<r.cost)return toast('Dữ liệu đã thay đổi, vui lòng thử lại','warning');const applied=logTransaction(sid,-r.cost,'Đổi quà: '+r.name,'Ghi chung / Nề nếp');if(applied!==-r.cost)return toast('Không thể trừ đủ xu để đổi quà','warning');r.stock--;state.redemptions.unshift({id:uid('rd'),classId:state.activeClassId,studentId:sid,studentName:s.name,rewardName:r.name,cost:r.cost,time:new Date().toISOString()});saveState();renderPage();confettiLite();toast('Đổi quà thành công')}
const WHEEL_EFFECTS=['Xoáy tròn','Tung nảy','Hút vào tâm','Bay theo quỹ đạo','Mưa bóng','Sân khấu ánh sáng','Sóng bồng bềnh'];
function renderWheel(){const candidates=wheelCandidates(),group=state.wheelGroup||'all',mode=state.settings.wheelEffectMode||'random';return `<div class="wheel-layout"><div class="card wheel-card"><div class="d-flex justify-content-between"><span class="badge text-bg-light">Hiệu ứng: <b id="effectLabel">${esc(state.wheelEffect||'Xoáy tròn')}</b></span><button class="icon-btn" onclick="beep()"><i class="fa-solid fa-volume-high"></i></button></div><div class="wheel-machine" id="wheelMachine">${candidates.map((s,i)=>`<div class="wheel-ball" data-index="${i}" title="${esc(s.name)}">${safeAvatar(s.avatar)?`<img src="${safeAvatar(s.avatar)}" alt="">`:esc(initials(s.name))}</div>`).join('')}</div><button id="spinBtn" class="btn btn-primary w-100 py-3 fs-5" onclick="spinWheel()" ${candidates.length?'':'disabled'}><i class="fa-solid fa-wand-magic-sparkles me-2"></i>QUAY NGAY</button><div class="d-flex justify-content-between mt-2 text-muted small"><span>🌐 Trong lồng: ${candidates.length} học sinh</span><span>${state.settings.wheelExclude?'🛡️ Loại trừ sau khi trúng':'↻ Có thể trúng lại'}</span></div><div class="card p-3 mt-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" ${state.settings.wheelExclude?'checked':''} onchange="state.settings.wheelExclude=this.checked;saveState(false);renderPage()"><label class="form-check-label fw-bold">Loại trừ sau khi trúng</label></div>${state.wheelExcluded.length?`<div class="mt-2"><small>Đã loại khỏi lồng (${state.wheelExcluded.length}):</small><div>${state.wheelExcluded.map(id=>{const s=state.students.find(x=>x.id===id);return s?`<span class="subject-chip">${esc(s.name)} <i class="fa-solid fa-rotate-left" onclick="restoreWheel('${id}')" style="cursor:pointer"></i></span>`:''}).join('')} <button class="btn btn-sm btn-link" onclick="restoreAllWheel()">Cho tất cả vào lại</button></div></div>`:''}</div></div><div><div class="card p-3"><h5 class="fw-bold">Nguồn học sinh</h5><div class="btn-group w-100 mb-3" function wheelCandidates(){let ss=classStudents().filter(s=>!state.wheelExcluded.includes(s.id));if(state.wheelGroup==='favorite')ss=ss.filter(s=>s.favorite);if(state.wheelGroup==='manual'){const selected=new Set(state.wheelSelected||[]);ss=ss.filter(s=>selected.has(s.id))}return ss}
function positionWheelBalls(){const balls=[...document.querySelectorAll('.wheel-ball')],n=balls.length;balls.forEach((b,i)=>{const a=(i/n)*Math.PI*2-Math.PI/2;const r=n>10?39:35;b.style.left=(50+Math.cos(a)*r)+'%';b.style.top=(50+Math.sin(a)*r)+'%'})}
function selectWheelEffect(e){state.wheelEffect=e;state.settings.wheelEffectMode='fixed';saveState(false);renderPage()}function setWheelEffectMode(m){state.settings.wheelEffectMode=m==='fixed'?'fixed':'random';saveState(false);renderPage()}function setWheelGroup(g){if(g==='manual')return openWheelManualSelection();state.wheelGroup=g;saveState(false);renderPage()}
async function openWheelManualSelection(){const ss=classStudents();if(!ss.length)return toast('Chưa có học sinh','info');const selected=new Set(state.wheelSelected||[]);const html=`<div class="text-start" style="max-height:360px;overflow:auto">${ss.map((s,i)=>`<label class="d-flex align-items-center gap-2 py-2 border-bottom"><input class="form-check-input wheel-manual-check" type="checkbox" value="${esc(s.id)}" ${selected.has(s.id)?'checked':''}><span>${esc(s.name)}</span></label>`).join('')}</div>`;const {value:ids}=await Swal.fire({title:'Chọn học sinh vào vòng quay',html,showCancelButton:true,confirmButtonText:'Áp dụng',preConfirm:()=>[...Swal.getHtmlContainer().querySelectorAll('.wheel-manual-check:checked')].map(x=>x.value)});if(ids===undefined)return;state.wheelSelected=ids;state.wheelGroup='manual';saveState(false);renderPage();toast(`Đã chọn ${ids.length} học sinh`) }
async function spinWheel(){const cand=wheelCandidates();if(!cand.length)return toast(state.wheelGroup==='manual'?'Chưa chọn học sinh hoặc tất cả đã bị loại':'Không còn học sinh phù hợp để quay','warning');const machine=document.getElementById('wheelMachine'),btn=document.getElementById('spinBtn');if(!machine||!btn)return;btn.disabled=true;WHEEL_EFFECTS.forEach((_,i)=>machine.classList.remove('fx'+i));const effect=state.settings.wheelEffectMode==='fixed'&&WHEEL_EFFECTS.includes(state.wheelEffect)?state.wheelEffect:WHEEL_EFFECTS[Math.floor(Math.random()*WHEEL_EFFECTS.length)];state.wheelEffect=effect;machine.classList.add('fx'+WHEEL_EFFECTS.indexOf(effect),'spinning');const lab=document.getElementById('effectLabel');if(lab)lab.textContent=effect;await new Promise(r=>setTimeout(r,1900));const current=wheelCandidates();if(!current.length){machine.classList.remove('spinning');btn.disabled=false;return toast('Danh sách quay đã thay đổi','warning')}const s=current[Math.floor(Math.random()*current.length)];if(state.settings.wheelExclude&&!state.wheelExcluded.includes(s.id))state.wheelExcluded.push(s.id);state.wheelHistory.unshift({id:uid('wh'),classId:state.activeClassId,studentId:s.id,studentName:s.name,effect,time:new Date().toISOString()});saveState(false);machine.classList.remove('spinning');beep(880,.25,.15);showWinner(s,'wheel')}
async function showWinner(s,type){const result=await Swal.fire({title:'🎉 CHÚC MỪNG HỌC SINH MAY MẮN!',html:`<div class="mx-auto student-avatar mb-2">${safeAvatar(s.avatar)?`<img src="${safeAvatar(s.avatar)}" alt="">`:esc(initials(s.name))}</div><h2 class="fw-bold">${esc(s.name)}</h2><div class="text-muted">Thưởng xu ngay:</div><div class="d-flex justify-content-center gap-2 mt-3 flex-wrap"><button class="btn btn-primary" onclick="Swal.clickConfirm()" data-award="1">+1 xu</button></div>`,showCancelButton:true,confirmButtonText:'Quay tiếp / Đóng',cancelButtonText:'Đóng',didOpen:()=>{const box=Swal.getHtmlContainer();box.querySelector('.d-flex').innerHTML=[1,2,5,10].map(n=>`<button class="btn btn-primary" onclick="awardWinner('${s.id}',${n})">+${n} xu</button>`).join('')}});renderPage()}
function awardWinner(id,n){logTransaction(id,n,'Thưởng trò chơi','Ghi chung / Nề nếp');saveState();toast('Đã thưởng +'+n+' xu');confettiLite();Swal.close();renderPage()}
function restoreWheel(id){state.wheelExcluded=state.wheelExcluded.filter(x=>x!==id);saveState(false);renderPage()}function restoreAllWheel(){state.wheelExcluded=[];saveState(false);renderPage()}function clearWheelHistory(){state.wheelHistory=state.wheelHistory.filter(x=>x.classId!==state.activeClassId);saveState();renderPage()}
function renderFilm(){const cand=filmCandidates();return `<div class="grid-2"><div class="card p-3"><h5 class="fw-bold text-center mb-3">🎞️ MÁY CHIẾU PHIM MAY MẮN 🎞️</h5><div class="film-stage"><div class="film-strip" id="filmStrip">${[...cand,...cand,...cand].map(s=>filmPerson(s)).join('')}</div><div class="film-marker"></div></div><div class="winner-box mt-3" id="filmWinner"><div class="text-muted">Bấm quay để chọn học sinh ngẫu nhiên</div></div><button class="btn btn-primary w-100 mt-3 py-3 fs-5" id="filmBtn" onclick="spinFilm()"><i class="fa-solid fa-play me-2"></i>🎬 Bấm Quay Cuộn Phim!</button><div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox" ${state.settings.filmExclude?'checked':''} onchange="state.settings.filmExclude=this.checked;saveState(false);renderPage()"><label class="form-check-label fw-bold">Tự động loại học sinh sau khi chọn</label></div></div><div><div class="card p-3"><h5 class="fw-bold">Học sinh trong cuộn phim (${cand.length})</h5><div class="student-grid" style="grid-template-columns:repeat(3,1fr)">${cand.map(s=>`<div class="text-center">${renderAvatar(s,'mini-avatar')}<div class="small fw-bold mt-1">${esc(s.name.split(' ').slice(-2).join(' '))}</div></div>`).join('')}</div>${state.filmExcluded.length?`<button class="btn btn-sm btn-outline-primary mt-3" onclick="state.filmExcluded=[];saveState(false);renderPage()">Đưa tất cả vào lại</button>`:''}</div><div class="card p-3 mt-3"><h5 class="fw-bold">🏆 Lịch sử (${state.filmHistory.filter(x=>x.classId===state.activeClassId).length})</h5>${state.filmHistory.filter(x=>x.classId===state.activeClassId).slice(0,10).map(h=>`<div class="history-item"><strong>${esc(h.studentName)}</strong><span>${new Date(h.time).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<div class="empty">Chưa có lượt quay nào</div>'}</div></div></div>`}
function filmCandidates(){return classStudents().filter(s=>!state.filmExcluded.includes(s.id))}
function filmPerson(s){return `<div class="film-person">${renderAvatar(s,'mini-avatar')}<strong>${esc(s.name.split(' ').slice(-2).join(' '))}</strong></div>`}
async function spinFilm(){let cand=filmCandidates();if(!cand.length){state.filmExcluded=[];saveState(false);renderPage();return}const strip=document.getElementById('filmStrip'),btn=document.getElementById('filmBtn');btn.disabled=true;const s=cand[Math.floor(Math.random()*cand.length)];const all=[...cand,...cand,...cand],idx=cand.length+all.findIndex((x,i)=>i<cand.length&&x.id===s.id);const itemW=142,stage=document.querySelector('.film-stage').clientWidth;const translate=-(idx*itemW-stage/2+itemW/2+18);strip.style.transform=`translateX(${translate}px)`;await new Promise(r=>setTimeout(r,2850));if(state.settings.filmExclude)state.filmExcluded.push(s.id);state.filmHistory.unshift({id:uid('fh'),classId:state.activeClassId,studentId:s.id,studentName:s.name,time:new Date().toISOString()});saveState(false);beep(740,.3,.14);document.getElementById('filmWinner').innerHTML=`<div class="text-warning fw-bold">🏆 PHIM DỪNG TẠI...</div><h2 class="fw-bold">${esc(s.name)}</h2><div class="d-flex justify-content-center gap-2"><select id="filmAward" class="form-select" style="width:120px">${[1,2,3,5,10,15,20].map(n=>`<option value="${n}" ${n===2?'selected':''}>+${n} xu</option>`).join('')}</select><button class="btn btn-warning" onclick="awardFilm('${s.id}')"><i class="fa-solid fa-coins me-1"></i>Thưởng xu</button><button class="btn btn-light" onclick="renderPage()">Reset</button></div>`;confettiLite();btn.disabled=false}
function awardFilm(id){const n=+document.getElementById('filmAward').value;logTransaction(id,n,'Thưởng cuộn phim','Ghi chung / Nề nếp');saveState();toast('Đã thưởng +'+n+' xu')}
function renderNoise(){return `<div class="section-head"><div><h2><i class="fa-solid fa-shield-halved text-primary me-2"></i>Công cụ Chống Ồn</h2><p>Bấm cảnh báo tức thì, đếm ngược im lặng hoặc dùng microphone phát hiện tiếng ồn tự động.</p></div></div><div class="grid-equal"><div class="card p-3"><h5 class="fw-bold">🔔 Cảnh Báo Tức Thì</h5><div class="alert-grid mt-3"><div class="class-alert" style="background:#fef3c7;border-color:#f59e0b" onclick="classAlert('🤫','SHH! Im lặng nào!','#d97706')"><span class="fs-1">🤫</span>SHH! Im lặng nào!</div><div class="class-alert" style="background:#ffedd5;border-color:#fb923c" onclick="classAlert('⚠️','LỚP QUÁ ỒN!','#ea580c')"><span class="fs-1">⚠️</span>LỚP QUÁ ỒN!</div><div class="class-alert" style="background:#fee2e2;border-color:#ef4444" onclick="classAlert('🚨','DỪNG LẠI NGAY!','#dc2626')"><span class="fs-1">🚨</span>DỪNG LẠI NGAY!</div><div class="class-alert" style="background:#d1fae5;border-color:#10b981" onclick="classAlert('🌟','TUYỆT VỜI!','#059669')"><span class="fs-1">🌟</span>TUYỆT VỜI!</div></div></div><div class="card p-3"><h5 class="fw-bold">🎵 Đếm Ngược Im Lặng</h5><div class="quiet-timer" id="quietTimer">⏱️</div><div class="d-flex justify-content-center gap-2 flex-wrap mt-3">${[10,15,20,30,60].map(n=>`<button class="btn btn-outline-primary" onclick="startQuiet(${n})">${n}s</button>`).join('')}</div><div class="text-center text-muted small mt-2">Khi hết giờ sẽ tự động khen lớp “TUYỆT VỜI!”</div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><h5 class="fw-bold m-0">🎙️ Phát Hiện Tiếng Ồn Tự Động (Microphone)</h5><div><label class="form-check form-switch d-inline-block me-3"><input id="autoNoise" class="form-check-input" type="checkbox"><span class="form-check-label">Cảnh báo tự động</span></label><button id="micBtn" class="btn btn-outline-primary" onclick="toggleMic()"><i class="fa-solid fa-microphone me-1"></i>Bật micro</button></div></div><div class="d-flex justify-content-between mt-3"><span>Mức độ tiếng ồn</span><strong id="noisePct">0%</strong></div><div class="noise-meter mt-2"><div class="noise-fill" id="noiseFill"></div></div><div id="noiseStatus" class="alert alert-success mt-3 mb-0">Lớp đang yên tĩnh — Tốt lắm!</div><div class="row text-center small mt-2"><div class="col bg-success-subtle p-2 rounded-start">Yên tĩnh<br>0–40%</div><div class="col bg-warning-subtle p-2">Hơi ồn<br>40–70%</div><div class="col bg-danger-subtle p-2 rounded-end">Rất ồn<br>70–100%</div></div></div>`}
function classAlert(emoji,text,color){beep(text.includes('TUYỆT')?880:440,.3,.15);const o=document.createElement('div');o.className='full-alert-overlay';o.innerHTML=`<div class="full-alert-card" style="background:${color}"><div class="emoji">${emoji}</div><h2>${text}</h2><p>Nhấn bất kỳ đâu để đóng</p></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),3500)}
function startQuiet(sec){clearInterval(quietInterval);quietLeft=sec;const el=document.getElementById('quietTimer');if(el)el.textContent=quietLeft+'s';quietInterval=setInterval(()=>{quietLeft--;const x=document.getElementById('quietTimer');if(x)x.textContent=Math.max(0,quietLeft)+'s';if(quietLeft<=0){clearInterval(quietInterval);beep(880,.35,.15);classAlert('🌟','TUYỆT VỜI!','#059669')}},1000)}
async function toggleMic(){if(micStream){stopMic();return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micCtx=new (window.AudioContext||window.webkitAudioContext)();const src=micCtx.createMediaStreamSource(micStream),an=micCtx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);document.getElementById('micBtn').innerHTML='<i class="fa-solid fa-microphone-slash me-1"></i>Tắt micro';let lastWarn=0;const loop=()=>{an.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;const pct=Math.min(100,Math.round(avg/90*100));const f=document.getElementById('noiseFill'),p=document.getElementById('noisePct'),st=document.getElementById('noiseStatus');if(f)f.style.width=pct+'%';if(p)p.textContent=pct+'%';if(st){st.className='alert mt-3 mb-0 '+(pct<40?'alert-success':pct<70?'alert-warning':'alert-danger');st.textContent=pct<40?'Lớp đang yên tĩnh — Tốt lắm!':pct<70?'Lớp hơi ồn — Hãy nhắc nhẹ các em.':'Mức ồn cao — Cần ổn định lớp.'}if(pct>72&&document.getElementById('autoNoise')?.checked&&Date.now()-lastWarn>7000){lastWarn=Date.now();beep(360,.2,.15)}micRAF=requestAnimationFrame(loop)};loop()}catch(e){Swal.fire({icon:'error',title:'Không mở được microphone',text:'Trình duyệt có thể yêu cầu HTTPS/localhost và quyền truy cập microphone.'})}}
function stopMic(){if(micRAF)cancelAnimationFrame(micRAF);if(micStream)micStream.getTracks().forEach(t=>t.stop());if(micCtx)micCtx.close();micRAF=null;micStream=null;micCtx=null;const b=document.getElementById('micBtn');if(b)b.innerHTML='<i class="fa-solid fa-microphone me-1"></i>Bật micro'}
function renderCountdown(){return `<div class="countdown-layout"><div class="card p-3"><div class="countdown-ring" id="countdownRing"><div class="countdown-inner"><div class="countdown-time" id="countdownTime">05:00</div><div class="text-uppercase small" id="countdownStatus">Sẵn sàng</div></div></div><div class="d-flex justify-content-center gap-2 flex-wrap"><button class="btn btn-light" onclick="adjustCountdown(-30)">−30s</button><button id="countdownStart" class="btn btn-primary px-5" onclick="toggleCountdown()"><i class="fa-solid fa-play me-1"></i>Bắt đầu</button><button class="btn btn-light" onclick="adjustCountdown(30)">+30s</button><button class="btn btn-outline-primary" onclick="resetCountdown()"><i class="fa-solid fa-rotate-left"></i></button></div><div class="form-check form-switch text-center mt-3"><input class="form-check-input" id="tickLast10" type="checkbox" ${state.settings.tickLast10?'checked':''} onchange="state.settings.tickLast10=this.checked;saveState(false)"><label class="form-check-label">Tiếng tick cuối 10 giây</label></div></div><div><div class="card p-3"><h5 class="fw-bold">⏱ Thiết lập thời gian</h5><div class="row g-2 text-center"><div class="col"><input id="timerH" type="number" min="0" max="9" class="form-control text-center fw-bold" value="0"><small>GIỜ</small></div><div class="col"><input id="timerM" type="number" min="0" max="59" class="form-control text-center fw-bold" value="5"><small>PHÚT</small></div><div class="col"><input id="timerS" type="number" min="0" max="59" class="form-control text-center fw-bold" value="0"><small>GIÂY</small></div></div><button class="btn btn-primary w-100 mt-3" onclick="applyTimerInputs()">✓ Áp dụng thời gian này</button></div><div class="card p-3 mt-3"><h5 class="fw-bold">⚡ Mẫu nhanh</h5><div class="preset-grid">${[1,3,5,10,15,20,25,30,45,60].map(m=>`<button class="preset" onclick="setCountdown(${m*60})">${m===60?'1 giờ':m+' phút'}</button>`).join('')}</div></div><div class="card p-3 mt-3"><h5 class="fw-bold">🎨 Màu sắc đồng hồ</h5><div class="d-flex gap-2 flex-wrap">${[['#7c3aed','Tím'],['#0ea5e9','Xanh'],['#0d9488','Lá'],['#f59e0b','Cam'],['#f43f5e','Hồng']].map(([c,n])=>`<button class="btn btn-sm" style="border:2px solid ${c};color:${c}" onclick="setTimerColor('${c}')">● ${n}</button>`).join('')}</div></div></div></div>`}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function updateCountdownUI(){const t=document.getElementById('countdownTime'),r=document.getElementById('countdownRing'),st=document.getElementById('countdownStatus'),b=document.getElementById('countdownStart');if(t)t.textContent=fmtTime(countdown.left);if(r){const pct=countdown.total?countdown.left/countdown.total*100:0;r.style.setProperty('--progress',pct+'%');r.style.setProperty('--timer-color',state.settings.timerColor||'#0d9488')}if(st)st.textContent=countdown.running?'ĐANG ĐẾM NGƯỢC':'Sẵn sàng';if(b)b.innerHTML=countdown.running?'<i class="fa-solid fa-pause me-1"></i>Tạm dừng':'<i class="fa-solid fa-play me-1"></i>Bắt đầu'}
function setCountdown(s){clearInterval(countdownInterval);countdown={total:s,left:s,running:false};updateCountdownUI()}function applyTimerInputs(){const s=(+document.getElementById('timerH').value||0)*3600+(+document.getElementById('timerM').value||0)*60+(+document.getElementById('timerS').value||0);setCountdown(Math.max(1,s))}function adjustCountdown(n){countdown.left=Math.max(0,countdown.left+n);countdown.total=Math.max(countdown.total,countdown.left);updateCountdownUI()}function resetCountdown(){clearInterval(countdownInterval);countdown.left=countdown.total;countdown.running=false;updateCountdownUI()}
function toggleCountdown(){if(countdown.running){clearInterval(countdownInterval);countdown.running=false;updateCountdownUI();return}if(countdown.left<=0)countdown.left=countdown.total;countdown.running=true;updateCountdownUI();clearInterval(countdownInterval);countdownInterval=setInterval(()=>{countdown.left--;if(state.settings.tickLast10&&countdown.left<=10&&countdown.left>0)beep(900,.05,.04);if(countdown.left<=0){clearInterval(countdownInterval);countdown.running=false;beep(880,.5,.18);Swal.fire({icon:'success',title:'Hết giờ!',text:'Đồng hồ đếm ngược đã kết thúc.'})}updateCountdownUI()},1000)}function setTimerColor(c){state.settings.timerColor=c;saveState(false);updateCountdownUI()}
function renderLinks(){const ls=[...state.links].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));return `<div class="section-head"><div><h2><i class="fa-solid fa-link text-primary me-2"></i>Liên kết Tiện ích</h2><p>Lưu website, học liệu, Google Meet/Zoom và tài liệu hay dùng.</p></div><button class="btn btn-primary" onclick="openLinkModal()"><i class="fa-solid fa-plus me-1"></i>Thêm liên kết</button></div>${ls.length?`<div class="link-grid">${ls.map(l=>`<div class="card link-card hover-lift"><div class="d-flex gap-3"><div class="link-icon"><i class="fa-solid fa-link"></i></div><div class="flex-fill min-width-0"><div class="d-flex justify-content-between"><h5 class="fw-bold mb-1">${esc(l.name)} ${l.pinned?'📌':''}</h5></div><span class="badge text-bg-light">${esc(l.category)}</span><p class="text-muted small mt-2 mb-2">${esc(l.desc||'')}</p><div class="d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="openSafeUrl('${encodeURIComponent(l.url)}')">Mở liên kết</button><button class="icon-btn" onclick="openLinkModal('${l.id}')"><i class="fa-solid fa-pen"></i></button><button class="icon-btn text-danger" onclick="deleteLink('${l.id}')"><i class="fa-solid fa-trash"></i></button></div></div></div></div>`).join('')}</div>`:'<div class="card empty"><i class="fa-solid fa-book-open fs-1 mb-2"></i><h5>Chưa có liên kết tiện ích nào</h5><p>Hãy tạo các liên kết cố định cho lớp học.</p></div>'}`}

function openLinkModal(id=''){const l=state.links.find(x=>x.id===id)||{name:'',url:'https://',category:'Học liệu & SGK',desc:'',pinned:false};showModal(id?'Sửa liên kết':'Thêm Liên Kết Mới',`<form onsubmit="saveLink(event,'${id}')"><div class="mb-3"><label class="form-label fw-bold">Tên liên kết / Trang web *</label><input id="lName" class="form-control" required value="${esc(l.name)}"></div><div class="mb-3"><label class="form-label fw-bold">Địa chỉ URL (Link) *</label><input id="lUrl" class="form-control" required value="${esc(l.url)}"></div><div class="mb-3"><label class="form-label fw-bold">Danh mục</label><select id="lCat" class="form-select">${['Học liệu & SGK','Google Meet / Zoom','Bài tập','Trò chơi học tập','Tài liệu giáo viên','Khác'].map(x=>`<option ${l.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="mb-3"><label class="form-label fw-bold">Mô tả ngắn</label><input id="lDesc" class="form-control" value="${esc(l.desc)}"></div><div class="form-check"><input id="lPin" class="form-check-input" type="checkbox" ${l.pinned?'checked':''}><label class="form-check-label fw-bold">Ghim liên kết này lên đầu trang</label></div><div class="text-end mt-4"><button class="btn btn-primary">Thêm / Lưu Liên Kết</button></div></form>`)}
function saveLink(e,id){e.preventDefault();const d={name:document.getElementById('lName').value.trim(),url:document.getElementById('lUrl').value.trim(),category:document.getElementById('lCat').value,desc:document.getElementById('lDesc').value.trim(),pinned:document.getElementById('lPin').checked};if(id)Object.assign(state.links.find(x=>x.id===id),d);else state.links.push({id:uid('l'),...d});saveState();mainModal.hide();renderPage()}function deleteLink(id){state.links=state.links.filter(x=>x.id!==id);saveState();renderPage()}
function renderStats(){const ss=classStudents(),tx=state.transactions.filter(x=>x.classId===state.activeClassId),total=ss.reduce((a,s)=>a+s.coins,0),plus=tx.filter(x=>x.amount>0).length,minus=tx.filter(x=>x.amount<0).length,male=ss.filter(s=>s.gender==='Nam').length,female=ss.filter(s=>s.gender==='Nữ').length;return `<div class="section-head"><div><h2><i class="fa-solid fa-chart-column text-primary me-2"></i>Thống Kê Điểm Xu & Lịch Sử Tích Đổi</h2><p>Tổng hợp thi đua theo lớp, theo môn và nhật ký cộng/trừ điểm.</p></div><div class="d-flex gap-2"><button class="btn btn-outline-primary" onclick="exportStatsXlsx()"><i class="fa-solid fa-file-excel me-1"></i>Xuất Excel đầy đủ</button><button class="btn btn-primary" onclick="exportStatsPDF()"><i class="fa-solid fa-file-pdf me-1"></i>Xuất PDF</button></div></div><div id="statsReport"><div class="stats-grid"><div class="stat-card"><div class="label">Sĩ số học sinh</div><div class="value">${ss.length}</div><small>${male} Nam · ${female} Nữ</small><i class="fa-solid fa-users"></i></div><div class="stat-card"><div class="label">Tổng xu thi đua</div><div class="value">${total}</div><small>${ss.length?Math.round(total/ss.length):0} xu TB/HS</small><i class="fa-solid fa-coins"></i></div><div class="stat-card"><div class="label">Lượt cộng (+xu)</div><div class="value">${plus}</div><small>Khen thưởng ghi nhận</small><i class="fa-solid fa-plus"></i></div><div class="stat-card"><div class="label">Lượt trừ (-xu)</div><div class="value">${minus}</div><small>Nhắc nhở nề nếp</small><i class="fa-solid fa-minus"></i></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Bảng Xếp Hạng Xu Thi Đua</h5>${[...ss].sort((a,b)=>b.coins-a.coins).map((s,i)=>rankRow(s,i)).join('')}</div><div class="card p-3"><h5 class="fw-bold">Cơ Cấu Học Sinh & Tỷ Lệ Thi Đua</h5><div style="height:280px"><canvas id="genderChart"></canvas></div></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Thống kê theo môn học</h5><div style="height:300px"><canvas id="subjectChart"></canvas></div></div><div class="card p-3"><h5 class="fw-bold">Xu theo học sinh</h5><div style="height:300px"><canvas id="coinChart"></canvas></div></div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between flex-wrap gap-2"><h5 class="fw-bold">Lịch sử Cộng / Trừ Chi Tiết (${tx.length})</h5><div class="d-flex gap-2"><select id="txSubjectFilter" class="form-select form-select-sm" onchange="filterTxTable()"><option value="">Tất cả môn</option>${state.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="txSearch" class="form-control form-control-sm" placeholder="Tìm tên / lý do" oninput="filterTxTable()"></div></div><div class="table-responsive"><table class="table mt-2" id="txTable"><thead><tr><th>Thời gian</th><th>Học sinh</th><th>Môn</th><th>Lý do</th><th>Xu</th></tr></thead><tbody>${tx.map(txRow).join('')}</tbody></table></div></div>`}
function txRow(x){return `<tr data-subject="${esc(x.subject)}" data-search="${esc((x.studentName+' '+x.reason).toLowerCase())}"><td>${new Date(x.time).toLocaleString('vi-VN')}</td><td>${esc(x.studentName)}</td><td>${esc(x.subject)}</td><td>${esc(x.reason)}</td><td><span class="badge ${x.amount>=0?'bg-success':'bg-danger'}">${x.amount>=0?'+':''}${x.amount}</span></td></tr>`}
function filterTxTable(){const sub=document.getElementById('txSubjectFilter').value,q=document.getElementById('txSearch').value.toLowerCase();document.querySelectorAll('#txTable tbody tr').forEach(r=>r.style.display=(!sub||r.dataset.subject===sub)&&r.dataset.search.includes(q)?'':'none')}
function drawStatsCharts(){

function exportStatsXlsx(){const ss=classStudents().map((s,i)=>({STT:i+1,'Học sinh':s.name,'Giới tính':s.gender,'Xu':s.coins}));const tx=state.transactions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Môn':x.subject,'Lý do':x.reason,'Xu':x.amount}));const red=state.redemptions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Quà':x.rewardName,'Chi phí xu':x.cost}));const ws=weekStartDate(today()),comp=competitionRows(ws).map((r,i)=>({STT:i+1,'Học sinh':r.name,'Tổ':r.group,'Điểm tuần':r.total,'Xếp loại':r.rating}));downloadXlsx([['Xếp hạng xu',ss],['Cộng trừ xu',tx],['Đổi quà',red],['Thi đua tuần',comp]],`bao-cao-${activeClass().name}.xlsx`)}
async function exportStatsPDF(){const el=document.getElementById('statsReport');if(!el)return;const canvas=await html2canvas(el,{scale:1.5,backgroundColor:'#fff',useCORS:true});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const margin=10,pageW=210,pageH=297,contentW=pageW-margin*2,contentH=pageH-margin*2;const pxPerMm=canvas.width/contentW,pagePx=Math.floor(contentH*pxPerMm);let yPx=0,page=0;while(yPx<canvas.height){const sliceH=Math.min(pagePx,canvas.height-yPx),slice=document.createElement('canvas');slice.width=canvas.width;slice.height=sliceH;const ctx=slice.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);ctx.drawImage(canvas,0,yPx,canvas.width,sliceH,0,0,canvas.width,sliceH);const img=slice.toDataURL('image/jpeg',.92),imgH=sliceH/pxPerMm;if(page>0)pdf.addPage();pdf.addImage(img,'JPEG',margin,margin,contentW,imgH,undefined,'FAST');yPx+=sliceH;page++}pdf.save(`bao-cao-${activeClass().name}.pdf`);toast(`Đã tạo PDF ${page} trang`)}
function downloadXlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});XLSX.writeFile(wb,filename)}
function renderData(){const size=(new Blob([JSON.stringify(state)]).size/1024).toFixed(1),hasRecovery=!!localStorage.getItem(RECOVERY_KEY);return `<div class="section-head"><div><h2><i class="fa-solid fa-database text-primary me-2"></i>Quản lý Dữ liệu</h2><p>Sao lưu dữ liệu định kỳ để chuyển máy hoặc khôi phục khi cần.</p></div></div><div class="grid-equal"><div class="card p-4"><h4 class="fw-bold">📦 Sao lưu toàn bộ</h4><p class="text-muted">Xuất mọi lớp, học sinh, điểm danh, thi đua tuần, xu, lịch, phần thưởng và cài đặt thành JSON có phiên bản cấu trúc.</p><button class="btn btn-primary" onclick="exportJSON()"><i class="fa-solid fa-download me-1"></i>Xuất file JSON sao lưu</button><div class="mt-3 small text-muted">Schema v${APP_SCHEMA_VERSION} · Kích thước hiện tại: ~${size} KB</div></div><div class="card p-4"><h4 class="fw-bold">♻️ Khôi phục</h4><p class="text-muted">File nhập được kiểm tra và chuẩn hóa trước khi thay dữ liệu hiện tại.</p><button class="btn btn-outline-primary" onclick="document.getElementById('hiddenImport').click()"><i class="fa-solid fa-upload me-1"></i>Nhập file JSON</button>${hasRecovery?'<button class="btn btn-outline-warning ms-2" onclick="restoreRecovery()"><i class="fa-solid fa-clock-rotate-left me-1"></i>Khôi phục bản trước</button>':''}</div></div><div class="card p-4 mt-3 border-danger"><h4 class="fw-bold text-danger">⚠️ Vùng dữ liệu nguy hiểm</h4><p class="text-muted">Trước khi đặt lại, hệ thống tự giữ một bản khôi phục cục bộ.</p><button class="btn btn-outline-danger" onclick="resetAllData()"><i class="fa-solid fa-trash-can me-1"></i>Xóa và tạo lại dữ liệu mẫu</button></div>`}
function exportJSON(){
  const safeState = { ...state };
  if(currentUser?.role !== 'admin'){
    delete safeState.accounts;
  }
  const clsName = activeClass()?.name || 'Lop';
  const payload = {
    ...safeState,
    version: APP_SCHEMA_VERSION,
    _backup: {
      app: `Lớp ${clsName} - THCS Quang Trung V5.4`,
      schemaVersion: APP_SCHEMA_VERSION,
      rosterVersion: ROSTER_VERSION,
      exportedAt: new Date().toISOString()
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `lop-hoc-vui-ve-backup-${clsName}-v${APP_SCHEMA_VERSION}-${today()}.json`);
  toast('Đã xuất bản sao lưu');
}
async function importJSON(file){try{if(file.size>12*1024*1024)throw new Error('File sao lưu lớn hơn 12 MB');const text=await file.text(),obj=JSON.parse(text);if(!obj||typeof obj!=='object'||!Array.isArray(obj.classes)||!Array.isArray(obj.students))throw new Error('Sai cấu trúc sao lưu');const normalized=applyOfficialRosterMigration(normalizeState(obj));if(!normalized.classes.length)throw new Error('Không có lớp học hợp lệ');const r=await Swal.fire({icon:'warning',title:'Khôi phục dữ liệu?',html:`<div class="text-start">Tìm thấy <b>${normalized.classes.length}</b> lớp và <b>${normalized.students.length}</b> học sinh.<br>Dữ liệu hiện tại sẽ được giữ thành một bản khôi phục cục bộ trước khi thay thế.</div>`,showCancelButton:true,confirmButtonText:'Khôi phục'});if(!r.isConfirmed)return;recoverySnapshot();state=normalized;saveState();buildNav();renderHeader();renderPage();toast('Khôi phục thành công')}catch(e){Swal.fire({icon:'error',title:'File không hợp lệ',text:e.message})}}
async function resetAllData(){const r=await Swal.fire({icon:'warning',title:'Đặt lại toàn bộ dữ liệu?',text:'Hệ thống sẽ giữ một bản khôi phục cục bộ trước khi đặt lại.',showCancelButton:true,confirmButtonText:'Đặt lại',confirmButtonColor:'#dc2626'});if(!r.isConfirmed)return;recoverySnapshot();state=defaultState();saveState();buildNav();renderHeader();renderPage();toast('Đã đặt lại dữ liệu')}
async function restoreRecovery(){try{const raw=localStorage.getItem(RECOVERY_KEY);if(!raw)return toast('Không có bản khôi phục','info');const restored=normalizeState(JSON.parse(raw));const r=await Swal.fire({icon:'question',title:'Khôi phục bản dữ liệu trước?',showCancelButton:true,confirmButtonText:'Khôi phục'});if(!r.isConfirmed)return;recoverySnapshot();state=restored;saveState();buildNav();renderHeader();renderPage();toast('Đã khôi phục bản trước')}catch(e){Swal.fire({icon:'error',title:'Không thể khôi phục',text:e.message})}}

function saveGasApiUrl(){
  const val = document.getElementById('gasApiUrlInput')?.value.trim() || '';
  if(!val){
    state.settings.gasApiUrl = '';
    localStorage.removeItem('gas_api_url');
    saveState(false);
    toast('Đã xóa liên kết Google Sheets API', 'info');
    renderPage();
    return;
  }
  if(!val.startsWith('https://script.google.com/macros/s/')){
    return Swal.fire({
      icon: 'warning',
      title: 'URL chưa đúng định dạng',
      text: 'Đường dẫn Google Apps Script Web App thường bắt đầu bằng: https://script.google.com/macros/s/.../exec'
    });
  }
  state.settings.gasApiUrl = val;
  localStorage.setItem('gas_api_url', val);
  saveState(false);
  toast('Đã lưu cấu hình Google Sheets URL!');
  renderPage();
}

async function testGasApiConnection(){
  const inputEl = document.getElementById('gasApiUrlInput');
  const url = (inputEl ? inputEl.value.trim() : '') || state.settings?.gasApiUrl || localStorage.getItem('gas_api_url');
  if(!url){
    return Swal.fire({ icon: 'warning', title: 'Chưa nhập URL', text: 'Vui lòng nhập đường link Google Apps Script Web App URL trước.' });
  }
  Swal.fire({
    title: 'Đang kiểm tra kết nối...',
    text: 'Đang gửi gói tin thăm dò tới Google Apps Script Web App...',
    allowOutsideClick: false,
    didOpen: () => { Swal.showLoading(); }
  });
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'get_all_classes' })
    });
    const data = await res.json();
    if(data && data.status === 'success'){
      state.settings.gasApiUrl = url;
      localStorage.setItem('gas_api_url', url);
      saveState(false);
      Swal.fire({
        icon: 'success',
        title: 'Kết nối thành công!',
        html: `<div class="text-start">Google Sheets Cloud Backend phản hồi rất tốt!<br>Tìm thấy <b>${data.classes ? data.classes.length : 0} lớp</b> trên Google Sheets.<br><small class="text-muted">Trạng thái API: Sẵn sàng đồng bộ cho toàn trường.</small></div>`
      });
      renderHeader();
      renderPage();
    } else {
      throw new Error(data?.message || 'Phản hồi không hợp lệ từ máy chủ');
    }
  } catch(err){
    console.error(err);
    Swal.fire({
      icon: 'error',
      title: 'Không thể kết nối',
      html: `<div class="text-start">Không thể giao tiếp với Google Apps Script Web App.<br><br><b>Nguyên nhân thường gặp:</b><br>1. Chưa triển khai dưới dạng <b>Web app</b>.<br>2. Chưa chọn <b>"Ai có quyền truy cập: Bất kỳ ai" (Anyone)</b>.<br>3. Chưa chọn <b>"Thực thi dưới dạng: Tôi" (Me)</b>.<br>4. Link URL bị thiếu ký tự.<br><br><small class="text-muted">Chi tiết lỗi: ${esc(err.message)}</small></div>`
    });
  }
}

async function pullClassDataFromCloud(interactive = true){
  if(!currentUser) return;
  const url = state.settings?.gasApiUrl || localStorage.getItem('gas_api_url');
  if(!url){
    if(interactive) toast('Chưa cài đặt URL Google Sheets', 'warning');
    return;
  }
  if(interactive){
    Swal.fire({
      title: 'Đang tải dữ liệu...',
      text: 'Đang lấy dữ liệu mới nhất từ Google Sheets...',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });
  }
  const res = await callGasApi('get_class_data', {
    classId: state.activeClassId,
    role: currentUser?.role || '',
    assignedGroup: currentUser?.assignedGroup || ''
  });
  if(res && res.status === 'success'){
    let hasChanges = false;
    if(Array.isArray(res.students)){
      res.students.forEach(st => {
        if(st.cccd && st.cccd.length > 0 && st.cccd.length < 12 && /^\d+$/.test(st.cccd)){
          st.cccd = st.cccd.padStart(12, '0');
        }
      });
      state.students = state.students.filter(s => s.classId !== state.activeClassId).concat(res.students);
      hasChanges = true;
    }
    if(res.attendance && typeof res.attendance === 'object'){
      Object.assign(state.attendance, res.attendance);
      hasChanges = true;
    }
    if(Array.isArray(res.events)){
      state.competition.events = state.competition.events.filter(e => e.classId !== state.activeClassId).concat(res.events);
      hasChanges = true;
    }
    if(Array.isArray(res.pendingEvents)){
      state.competition.pendingEvents = res.pendingEvents;
      hasChanges = true;
    } else {
      state.competition.pendingEvents = state.competition.pendingEvents || [];
    }
    if(res.configs && typeof res.configs === 'object'){
      if(res.configs.seating) state.seating[state.activeClassId] = res.configs.seating;
      if(res.configs.groupAssignments) state.competition.groupAssignments = res.configs.groupAssignments;
    }
    if(hasChanges){
      saveState(false);
      buildNav();
      renderHeader();
      renderPage();
    }
    if(interactive){
      Swal.fire({
        icon: 'success',
        title: 'Đã đồng bộ từ Google Sheets',
        html: `<div class="text-start">Dữ liệu lớp <b>${esc(activeClass().name)}</b> đã được cập nhật thành công!<br>• Sĩ số: <b>${classStudents().length}</b> học sinh<br>• Ghi nhận thi đua: <b>${res.events ? res.events.length : 0}</b> lượt<br>• Bản ghi chờ duyệt: <b>${res.pendingEvents ? res.pendingEvents.length : 0}</b> lượt</div>`
      });
    }
  } else {
    if(interactive){
      Swal.fire({
        icon: 'error',
        title: 'Lỗi tải dữ liệu',
        text: res?.message || 'Không thể lấy dữ liệu từ Google Sheets.'
      });
    }
  }
}

async function pushClassDataToCloud(){
  const url = state.settings?.gasApiUrl || localStorage.getItem('gas_api_url');
  if(!url){
    return Swal.fire({
      icon: 'warning',
      title: 'Chưa kết nối Cloud',
      text: 'Vui lòng cài đặt và kiểm tra Google Apps Script Web App URL trước khi đẩy dữ liệu.'
    });
  }
  const ss = classStudents();
  const r = await Swal.fire({
    icon: 'question',
    title: 'Đẩy dữ liệu lên Cloud?',
    html: `<div class="text-start">Sẽ đồng bộ danh sách <b>${ss.length} học sinh</b> của lớp <b>${esc(activeClass().name)}</b> lên Google Sheets.<br><small class="text-muted">Dữ liệu trên sheet HocSinh của lớp này sẽ được cập nhật đồng bộ.</small></div>`,
    showCancelButton: true,
    confirmButtonText: 'Đẩy lên ngay'
  });
  if(!r.isConfirmed) return;

  Swal.fire({
    title: 'Đang đẩy dữ liệu...',
    text: 'Đang ghi danh sách học sinh vào Google Sheets...',
    allowOutsideClick: false,
    didOpen: () => { Swal.showLoading(); }
  });

  const res = await callGasApi('import_students', {
    classId: state.activeClassId,
    students: ss,
    mode: 'overwrite'
  });

  if(res && res.status === 'success'){
    Swal.fire({
      icon: 'success',
      title: 'Đồng bộ Cloud thành công!',
      text: `Đã lưu ${res.total || ss.length} học sinh của lớp ${activeClass().name} lên Google Sheets.`
    });
  } else {
    Swal.fire({
      icon: 'error',
      title: 'Đồng bộ thất bại',
      text: res?.message || 'Có lỗi xảy ra khi gửi dữ liệu lên Google Sheets.'
    });
  }
}

async function saveTeacher(e){
  e.preventDefault();
  const f=document.getElementById('teacherAvatarInput').files[0];
  if(f){
    if(f.size>1200000)return Swal.fire({icon:'warning',title:'Ảnh quá lớn',text:'Vui lòng chọn ảnh dưới 1,2 MB.'});
    state.teacher.avatar=await readFileData(f);
  }
  const logoF=document.getElementById('schoolLogoInput')?.files?.[0];
  if(logoF){
    if(logoF.size>1500000)return Swal.fire({icon:'warning',title:'Logo quá lớn',text:'Vui lòng chọn logo dưới 1,5 MB.'});
    state.settings = state.settings || {};
    state.settings.schoolLogo = await readFileData(logoF);
  }
  state.teacher.name=document.getElementById('tName').value.trim();
  state.teacher.role=document.getElementById('tRole').value.trim();
  state.teacher.subject=document.getElementById('tSubject').value.trim();
  state.teacher.school=document.getElementById('tSchool').value.trim();
  saveState();
  updateBrandLogo();
  renderHeader();
  renderPage();
  toast('Đã cập nhật thông tin giáo viên & logo');
}

async function handleSchoolLogoUpload(e){
  const file = e.target.files?.[0];
  if(!file) return;
  if(file.size > 1500000){
    return Swal.fire({ icon: 'warning', title: 'Ảnh quá lớn', text: 'Vui lòng chọn logo dung lượng dưới 1.5MB.' });
  }
  const data = await readFileData(file);
  state.settings = state.settings || {};
  state.settings.schoolLogo = data;
  saveState();
  updateBrandLogo();
  renderPage();
  toast('Đã cập nhật Logo trường học!');
}

function removeSchoolLogo(){
  if(state.settings){
    delete state.settings.schoolLogo;
  }
  saveState();
  updateBrandLogo();
  renderPage();

function filterAccountsTable(){
  const role = document.getElementById('accRoleFilter')?.value || '';
  const grade = document.getElementById('accGradeFilter')?.value || '';
  const status = document.getElementById('accStatusFilter')?.value || '';
  const q = (document.getElementById('accSearch')?.value || '').trim().toLowerCase();

  document.querySelectorAll('#accountsTable tbody tr').forEach(tr => {
    const trRole = tr.getAttribute('data-role') || '';
    const trGrade = tr.getAttribute('data-grade') || '';
    const trAssigned = tr.getAttribute('data-assigned') || 'yes';
    const trStatus = tr.getAttribute('data-status') || 'active';
    const trSearch = tr.getAttribute('data-search') || '';

    const matchRole = !role || trRole === role;

    let matchGrade = true;
    if (grade === 'unassigned') {
      matchGrade = trAssigned === 'no';
    } else if (grade) {
      matchGrade = trGrade === grade;
    }

    const matchStatus = !status || trStatus === status;
    const matchSearch = !q || trSearch.includes(q);

    tr.style.display = (matchRole && matchGrade && matchStatus && matchSearch) ? '' : 'none';
  });
}

function autoSuggestTeacherUsername(){
  const fn = document.getElementById('newTeacherFullname')?.value.trim() || '';
  const uEl = document.getElementById('newTeacherUsername');
  if(!uEl || uEl.dataset.customEdited === 'true') return;
  if(!fn){ uEl.value = ''; return; }
  const clean = fn.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d").replace(/[^a-z0-9]/g, "");
  uEl.value = 'gv_' + clean.slice(0, 15);
}

async function saveTeacherAccount(e){
  e.preventDefault();
  const fullname = document.getElementById('newTeacherFullname').value.trim();
  const username = document.getElementById('newTeacherUsername').value.trim().toLowerCase();
  const password = document.getElementById('newTeacherPassword').value.trim();
  const phone = document.getElementById('newTeacherPhone')?.value.trim() || '';
  const classId = document.getElementById('newTeacherClass')?.value || '';

  if (!username) return toast('Tên đăng nhập không được trống', 'warning');
  if (!password) return toast('Mật khẩu không được trống', 'warning');

  state.accounts = state.accounts || [];
  const existingIdx = state.accounts.findIndex(a => a.username.toLowerCase() === username);

  if (existingIdx >= 0) {
    const r = await Swal.fire({
      icon: 'question',
      title: 'Tài khoản đã tồn tại',
      html: `Tài khoản <b>${esc(username)}</b> đã có trong danh sách.<br>Bạn có muốn cập nhật thông tin và mật khẩu mới cho tài khoản này không?`,
      showCancelButton: true,
      confirmButtonText: 'Cập nhật tài khoản',
      cancelButtonText: 'Hủy'
    });
    if (!r.isConfirmed) return;

    state.accounts[existingIdx].fullname = fullname;
    state.accounts[existingIdx].password = password;
    state.accounts[existingIdx].phone = phone;
    state.accounts[existingIdx].assignedClass = classId || state.accounts[existingIdx].assignedClass || '*';
    state.accounts[existingIdx].status = 'active';
    state.accounts[existingIdx].updatedAt = new Date().toISOString();
  } else {
    const newAcc = {
      id: uid('acc'),
      username,
      password,
      fullname,
      role: 'teacher',
      assignedClass: classId || '*',
      assignedGroup: '*',
      status: 'active',
      phone,
      updatedAt: new Date().toISOString()
    };
    state.accounts.push(newAcc);
  }

  // Cập nhật cả trong DEFAULT_ACCOUNTS nếu có
  const defAcc = DEFAULT_ACCOUNTS.find(a => a.username.toLowerCase() === username);
  if (defAcc) {
    defAcc.password = password;
    defAcc.fullname = fullname;
    if (classId) defAcc.assignedClass = classId;
  }

  // Nếu có phân công lớp
  if (classId) {
    const cls = state.classes.find(c => c.id === classId);
    if (cls) {
      cls.teacherName = fullname;
      if (phone) cls.teacherPhone = phone;
    }
  }

  saveState();
  mainModal.hide();
  renderPage();

  Swal.fire({
    icon: 'success',
    title: 'Đã lưu tài khoản & cấp mật khẩu!',
    html: `Tài khoản: <b class="font-monospace fs-5">${esc(username)}</b><br>Mật khẩu: <span class="badge bg-primary fs-5 font-monospace mt-2 px-3 py-2">${esc(password)}</span><br><small class="text-muted mt-2 d-block">Giáo viên có thể dùng thông tin này để đăng nhập ngay trên hệ thống.</small>`
  });

  if (state.settings?.gasApiUrl) {
    const targetAcc = state.accounts.find(a => a.username.toLowerCase() === username);
    callGasApi('save_account', { accountData: targetAcc });
    callGasApi('update_teacher_password', {
      username,
      newPassword: password,
      fullname: targetAcc?.fullname || fullname,
      role: targetAcc?.role || 'teacher',
      assignedClass: targetAcc?.assignedClass || classId,
      assignedGroup: '*'
    });

function saveTeacherAssignment(e){
  e.preventDefault();
  const username = document.getElementById('assignTeacherUsername').value;
  const classId = document.getElementById('assignClassId').value;

  const teacher = (state.accounts || []).find(a => a.username === username);
  const targetClass = (state.classes || []).find(c => c.id === classId);

  if (!teacher || !targetClass) return toast('Không tìm thấy thông tin hợp lệ', 'error');

  // Gỡ phân công lớp cũ của giáo viên này nếu có
  const oldClassId = teacher.assignedClass;
  if (oldClassId && oldClassId !== '*' && oldClassId !== classId) {
    const oldCls = state.classes.find(c => c.id === oldClassId);
    if (oldCls && oldCls.teacherName === teacher.fullname) {
      oldCls.teacherName = 'Chưa phân công';
    }
  }

  // Cập nhật tài khoản giáo viên
  teacher.assignedClass = classId;
  teacher.fullname = teacher.fullname.replace(/\(GVCN [^)]+\)/, '').trim();
  teacher.updatedAt = new Date().toISOString();

  // Cập nhật lớp học
  targetClass.teacherName = teacher.fullname;

  saveState();
  mainModal.hide();
  renderPage();
  toast(`Đã phân công ${teacher.fullname} làm GVCN lớp ${targetClass.name}!`);

  callGasApi('assign_teacher_to_class', {
    username,
    classId,
    teacherName: teacher.fullname
  });
}

function saveTeacherPassword(e, username){
  e.preventDefault();
  const newPassword = document.getElementById('changeTeacherPasswordInput').value.trim();
  if (!newPassword) return toast('Mật khẩu/Mã PIN không được để trống', 'warning');

  const uLower = String(username || '').trim().toLowerCase();
  state.accounts = state.accounts || [];
  let acc = state.accounts.find(a => a.username.toLowerCase() === uLower);
  if (!acc) {
    const def = DEFAULT_ACCOUNTS.find(a => a.username.toLowerCase() === uLower);
    acc = {
      id: uid('acc'),
      username: def ? def.username : uLower,
      password: newPassword,
      pin: newPassword,
      fullname: def?.fullname || uLower,
      role: def?.role || 'teacher',
      assignedClass: def?.assignedClass || '*',
      assignedGroup: def?.assignedGroup || '*',
      status: 'active',
      phone: '',
      updatedAt: new Date().toISOString()
    };
    state.accounts.push(acc);
  } else {
    acc.password = newPassword;
    acc.pin = newPassword;
    acc.updatedAt = new Date().toISOString();
  }

  // Cập nhật tất cả bản ghi trùng lặp (nếu có)
  state.accounts.forEach(a => {
    if (a.username.toLowerCase() === uLower) {
      a.password = newPassword;
      a.pin = newPassword;
      a.updatedAt = new Date().toISOString();
    }
  });

  // Cập nhật cả trong DEFAULT_ACCOUNTS
  DEFAULT_ACCOUNTS.forEach(a => {
    if (a.username.toLowerCase() === uLower) {
      a.password = newPassword;
      a.pin = newPassword;
    }
  });

  saveState();
  mainModal.hide();
  renderPage();
  Swal.fire({
    icon: 'success',
    title: 'Đã cập nhật thành công!',
    html: `Thông tin bảo mật mới cho tài khoản <b>${esc(uLower)}</b> (${esc(acc.fullname)}) là:<br><span class="badge bg-primary fs-5 font-monospace mt-2 px-3 py-2">${esc(newPassword)}</span><br><small class="text-muted mt-2 d-block">Tài khoản có thể đăng nhập ngay bằng mật khẩu/PIN mới này.</small>`
  });

  if (state.settings?.gasApiUrl) {
    callGasApi('save_account', {
      accountData: acc
    });
    callGasApi('update_teacher_password', {
      username: uLower,
      newPassword: newPassword,
      fullname: acc.fullname,
      role: acc.role,
      assignedClass: acc.assignedClass,
      assignedGroup: acc.assignedGroup
    });
  }
}

function deleteTeacherAccount(username){
  const uLower = String(username || '').trim().toLowerCase();
  if (uLower === 'admin') return toast('Không thể xóa tài khoản Quản trị viên', 'warning');
  const acc = (state.accounts || []).find(a => a.username.toLowerCase() === uLower);
  if (!acc) return toast('Không tìm thấy tài khoản', 'error');

  Swal.fire({
    icon: 'warning',
    title: 'Xóa tài khoản giáo viên?',
    html: `Bạn có chắc chắn muốn xóa tài khoản <b>${esc(acc.username)}</b> (${esc(acc.fullname)})?<br><small class="text-danger">Lớp được phân công sẽ chuyển về trạng thái Chưa phân công GVCN.</small>`,
    showCancelButton: true,
    confirmButtonText: 'Xác nhận xóa',
    confirmButtonColor: '#dc2626'
  }).then(r => {
    if (r.isConfirmed) {
      if (acc.assignedClass && acc.assignedClass !== '*') {

function togglePasswordVisibility(username){
  const el = document.getElementById('pwd_val_' + username);
  const icon = document.getElementById('pwd_eye_' + username);
  if (!el) return;
  const raw = el.getAttribute('data-raw') || '123456';
  if (el.textContent === '••••••••') {
    el.textContent = raw;
    if (icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
  } else {
    el.textContent = '••••••••';
    if (icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
  }
}

function generateRandomPassword(targetInputId = 'newTeacherPassword'){
  const prefixes = ['Gvcn', 'Thcs', 'Gvqt', 'Qtrung'];
  const years = ['2026', '2027', '8899', '6688', '7799'];
  const symbols = ['@', '#', '$', '!'];
  const pref = prefixes[Math.floor(Math.random() * prefixes.length)];
  const sym = symbols[Math.floor(Math.random() * symbols.length)];
  const yr = years[Math.floor(Math.random() * years.length)];
  const pwd = pref + sym + yr;

  const inputEl = document.getElementById(targetInputId);
  if (inputEl) inputEl.value = pwd;
  toast('Đã tạo mật khẩu mới: ' + pwd);
  return pwd;
}

async function pullAccountsFromCloud(){
  const url = state.settings?.gasApiUrl || localStorage.getItem('gas_api_url');
  if (!url) return toast('Chưa cài đặt link Google Apps Script URL', 'warning');

  Swal.fire({
    title: 'Đang tải danh sách tài khoản...',
    text: 'Đang kết nối Google Sheets...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  const res = await callGasApi('get_all_accounts');
  if (res && res.status === 'success' && Array.isArray(res.accounts)) {
    const cloudAccounts = res.accounts;
    state.accounts = state.accounts || [];

    cloudAccounts.forEach(ca => {
      const idx = state.accounts.findIndex(la => la.username.toLowerCase() === ca.username.toLowerCase());
      if (idx >= 0) {
        state.accounts[idx] = Object.assign(state.accounts[idx], ca);
      } else {
        state.accounts.push({
          id: uid('acc'),
          ...ca
        });
      }
    });

    syncClassesAndAccounts(false);
    saveState();
    Swal.fire({
      icon: 'success',
      title: 'Đồng bộ Cloud thành công!',
      text: `Đã nạp ${cloudAccounts.length} tài khoản từ Google Sheets.`
    });
    renderPage();
  } else {
    // Phát hiện trường hợp Google Apps Script của người dùng chưa có hàm get_all_accounts
    if (res?.message?.includes('get_all_accounts') || res?.message?.includes('Hành động không hợp lệ')) {
      Swal.fire({
        icon: 'info',
        title: 'Cần cập nhật bản triển khai Google Apps Script',
        html: `
          <div class="text-start">
            <p>Trang tính Google Sheets của bạn đang chạy phiên bản Apps Script cũ (chưa kích hoạt hàm <code>get_all_accounts</code>).</p>
            <p><b>Bạn có thể chọn 1 trong 2 giải pháp tiện lợi sau:</b></p>
            <div class="d-grid gap-2 mt-3">
              <button class="btn btn-success" onclick="Swal.close(); pushAccountsToCloud();">
                <i class="fa-solid fa-cloud-arrow-up me-1"></i>Đẩy toàn bộ tài khoản hiện tại lên Cloud trước (Push All)
              </button>
              <button class="btn btn-outline-primary" onclick="Swal.close(); showGasGuideModal();">
                <i class="fa-solid fa-code me-1"></i>Xem hướng dẫn cập nhật mã Apps Script (1 phút)
              </button>
            </div>
          </div>
        `,
        showConfirmButton: false,
        showCancelButton: true,
        cancelButtonText: 'Đóng'
      });
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Đồng bộ thất bại',
        text: res?.message || 'Không thể lấy dữ liệu từ Google Sheets.'
      });
    }
  }
}

async function pushAccountsToCloud(){
  const url = state.settings?.gasApiUrl || localStorage.getItem('gas_api_url');
  if (!url) return toast('Chưa cài đặt link Google Apps Script URL', 'warning');

  // Đảm bảo dữ liệu chuẩn hóa trước khi đẩy
  syncClassesAndAccounts(false);
  const accountsToPush = state.accounts || [];

  Swal.fire({
    title: 'Đang đẩy tài khoản lên Cloud...',
    html: `Đang gửi <b>${accountsToPush.length}</b> tài khoản lên Google Sheets...<br><div class="progress mt-2" style="height:6px"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div></div>`,
    allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: () => Swal.showLoading()
  });

  // 1. Thử gửi đồng loạt bulk bằng sync_all_accounts (phiên bản tối ưu)
  let res = await callGasApi('sync_all_accounts', { accounts: accountsToPush });

  // 2. Fallback nếu Apps Script bản cũ chưa có sync_all_accounts: gửi từng tài khoản qua save_account
  if (!res || res.status !== 'success') {
    if (res?.message?.includes('Hành động không hợp lệ') || res?.message?.includes('sync_all_accounts')) {
      Swal.fire({
        title: 'Đang chuyển chế độ gửi tương thích...',
        html: 'Google Apps Script đang ở phiên bản cũ, hệ thống tự động đẩy từng tài khoản lên bảng tính...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      let successCount = 0;
      for (const acc of accountsToPush) {
        const singleRes = await callGasApi('save_account', { accountData: acc });
        if (singleRes && singleRes.status === 'success') successCount++;
      }

      Swal.fire({
        icon: 'success',
        title: 'Đã hoàn tất gửi dữ liệu!',
        html: `Đã đồng bộ <b>${successCount}/${accountsToPush.length}</b> tài khoản lên Google Sheets qua cổng tương thích.<br><br><button class="btn btn-sm btn-outline-primary" onclick="showGasGuideModal()"><i class="fa-solid fa-circle-question me-1"></i>Xem cách cập nhật Apps Script để chạy nhanh tức thì</button>`
      });
      return;
    }
  }

  if (res && res.status === 'success') {
    Swal.fire({
      icon: 'success',
      title: 'Đồng bộ Cloud thành công!',
      html: `Đã đồng bộ <b>${accountsToPush.length}</b> tài khoản (Admin, GVCN, Tổ Trưởng) lên bảng <code>${res.sheetName || 'USERS'}</code> của Google Sheets!`
    });
  } else {
    Swal.fire({
      icon: 'error',
      title: 'Đẩy lên Cloud thất bại',
      text: res?.message || 'Không thể kết nối đến Google Sheets.'
    });
  }
}

          <div class="ms-2 me-auto">
            <div class="fw-bold">Mở Apps Script trên Google Trang tính</div>
            Trên file Google Sheets của trường, nhấn vào menu <b>Tiện ích mở rộng (Extensions)</b> &rarr; <b>Apps Script</b>.
          </div>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-start">
          <div class="ms-2 me-auto">
            <div class="fw-bold">Sao chép mã từ file google_apps_script.js</div>
            Mở file <code>google_apps_script.js</code> trong thư mục dự án, sao chép toàn bộ nội dung và dán đè vào file <code>Code.gs</code> trong Google Apps Script.
          </div>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-start">
          <div class="ms-2 me-auto">
            <div class="fw-bold">Triển khai phiên bản mới (Rất quan trọng)</div>
            Nhấn nút <b>Triển khai (Deploy)</b> &rarr; <b>Quản lý bản triển khai (Manage deployments)</b> &rarr; Bấm biểu tượng <b>Chiếc bút chì (Chỉnh sửa)</b> &rarr; Ở mục <i>Phiên bản (Version)</i> chọn <b>Phiên bản mới (New version)</b> &rarr; Nhấn <b>Triển khai (Deploy)</b>.
          </div>
        </li>
      </ol>
      <div class="alert alert-warning py-2 small mb-3">
        <i class="fa-solid fa-triangle-exclamation me-1"></i>
        <b>Lưu ý quan trọng:</b> Bắt buộc phải chọn <b>"Phiên bản mới" (New version)</b> khi chỉnh sửa bản triển khai thì Google mới cập nhật các hàm mới (như <code>get_all_accounts</code>, <code>sync_all_accounts</code>).
      </div>
      <div class="text-end">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Đã hiểu</button>
      </div>
    </div>
  `);
}

document.addEventListener('DOMContentLoaded',()=>{
  const modalEl = document.getElementById('mainModal');
  if(modalEl && typeof bootstrap !== 'undefined' && bootstrap.Modal){
    mainModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
  }
  const handledDeepLink = handleUrlParams();
  updateBrandLogo();
  if(currentUser){
    document.body.classList.remove('not-authenticated');
    applyUserPermissions();
  } else {
    document.body.classList.add('not-authenticated');
    buildNav();
    renderHeader();
    renderPage();
  }
  document.getElementById('hiddenImport').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
  if(currentUser && (state.settings?.gasApiUrl || localStorage.getItem('gas_api_url'))){
    pullClassDataFromCloud(false);
  }
});
</script>
